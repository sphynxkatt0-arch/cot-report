name: COT Intelligence Production Verify

on:
  workflow_run:
    workflows: ["Refresh and Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify published branch manifest
        id: release
        shell: bash
        run: |
          set -euo pipefail
          python source/analysis/build_atomic_release.py --verify published
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          pointer=json.loads(Path('published/release-manifest.json').read_text())
          current=pointer['current']
          print(f"release_id={current['release_id']}")
          print(f"entrypoint={current['entrypoint']}")
          print(f"manifest={current['manifest']}")
          PY

      - name: Verify public immutable release and application contract
        env:
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
          ENTRYPOINT: ${{ steps.release.outputs.entrypoint }}
          RELEASE_MANIFEST: ${{ steps.release.outputs.manifest }}
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY#*/}"
          base="https://${GITHUB_REPOSITORY_OWNER}.github.io/${repo}"
          nonce="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf /tmp/cot-intel-public && mkdir -p /tmp/cot-intel-public

          ok=false
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 15 "${base}/release-manifest.json?v=${nonce}-${attempt}" -o /tmp/cot-intel-public/pointer.json; then
              public_release="$(python - <<'PY'
          import json
          print(json.load(open('/tmp/cot-intel-public/pointer.json'))['current']['release_id'])
          PY
              )"
              if [ "$public_release" = "$RELEASE_ID" ]; then
                prefix="${base}/releases/${RELEASE_ID}"
                if curl -fsS --max-time 15 "${base}/${ENTRYPOINT}?v=${nonce}-${attempt}" -o /tmp/cot-intel-public/index.html \
                  && curl -fsS --max-time 15 "${base}/${RELEASE_MANIFEST}?v=${nonce}-${attempt}" -o /tmp/cot-intel-public/manifest.json \
                  && curl -fsS --max-time 15 "${prefix}/worldclass/cot-current-state.json?v=${nonce}-${attempt}" -o /tmp/cot-intel-public/current.json \
                  && curl -fsS --max-time 15 "${prefix}/worldclass/cot-edge-registry.json?v=${nonce}-${attempt}" -o /tmp/cot-intel-public/registry.json \
                  && curl -fsS --max-time 15 "${prefix}/worldclass/cot-active-edges.json?v=${nonce}-${attempt}" -o /tmp/cot-intel-public/active.json \
                  && curl -fsS --max-time 15 "${prefix}/worldclass/cot-cross-market.json?v=${nonce}-${attempt}" -o /tmp/cot-intel-public/cross.json \
                  && curl -fsS --max-time 15 "${prefix}/worldclass/regime_backtest.json?v=${nonce}-${attempt}" -o /tmp/cot-intel-public/regime.json; then
                  if python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cot-intel-public')
          html=(root/'index.html').read_text()
          manifest=json.loads((root/'manifest.json').read_text())
          current=json.loads((root/'current.json').read_text())
          registry=json.loads((root/'registry.json').read_text())
          active=json.loads((root/'active.json').read_text())
          cross=json.loads((root/'cross.json').read_text())
          regime=json.loads((root/'regime.json').read_text())

          assert manifest['release_id']
          assert manifest['immutable'] is True
          assert len(current.get('actor_states') or {}) == 59
          assert registry.get('automatic_promotion_allowed') is False
          assert active.get('governance',{}).get('pp_definition') == 'percentage points'
          assert cross.get('governance',{}).get('status') == 'DISCOVERY_ONLY'
          assert regime.get('macro_vintage_safe') is False
          assert regime.get('macro_directional_weight') == 0.0
          assert 'data-cot-intelligence-asset="js"' in html
          print('Public immutable release PASS:', manifest['release_id'])
          PY
                  then ok=true; break; fi
                fi
              fi
            fi
            sleep 5
          done
          test "$ok" = true
