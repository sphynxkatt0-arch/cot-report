name: COT actor predictive power CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/evaluate_cot_actor_predictive_power*'
      - 'analysis/build_cot_actor_event_research*'
      - 'analysis/cftc_release_calendar.py'
      - 'analysis/cot_release_alignment_v2.py'
      - 'analysis/cot_research_core.py'
      - '.github/workflows/cot-actor-predictive-power-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predictive-power-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r analysis/requirements.txt
      - name: Restore full-history research sources
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          cd analysis
          python - <<'PY'
          import build_worldclass_research_artifacts as r
          r.WORLDCLASS.mkdir(parents=True,exist_ok=True)
          r.atomic_write(r.WORLDCLASS/'base.json',r.build_research_base())
          metals=r.ensure_full_metals();r.atomic_write(r.WORLDCLASS/'metals.json',metals)
          PY
      - name: Run release-corrected actor predictive power
        working-directory: analysis
        run: python evaluate_cot_actor_predictive_power_v2.py
      - name: Validate v2 predictive contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('analysis/worldclass/research/cot-actor-predictive-power.json').read_text())
          s=json.loads(Path('analysis/worldclass/research/cot-actor-predictive-power-summary.json').read_text())
          assert p['research_generation']=='release-corrected-v2'
          assert p['information_contract_version']=='cftc-public-availability-v2'
          assert p['release_calendar_hash']
          assert p['series_count']==59
          assert p['metric_count']==59*3*15
          assert s['research_generation']=='release-corrected-v2'
          assert s['top_metrics']
          print('COT actor predictive power v2 PASS',p['metric_count'])
          PY
      - name: Strict overlap/FDR validation on corrected events
        working-directory: analysis
        run: python finalize_cot_actor_predictive_power.py
      - name: Validate strict summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('analysis/worldclass/research/cot-actor-predictive-power-validated-summary.json').read_text())
          assert p['source_metric_count']==2655
          assert sum(p['counts'].values())==2655
          print('Strict corrected actor predictive validation PASS',p['counts'])
          PY
