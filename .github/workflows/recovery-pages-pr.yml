name: Recovery Pages Deploy

on:
  pull_request:
    branches: [main]
    types: [synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/recovery-pages-pr.yml"

permissions:
  contents: write

concurrency:
  group: recovery-pages-pr
  cancel-in-progress: true

jobs:
  recover:
    if: github.head_ref == 'agent/extend-cot-to-russell-dow-gold'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout recovery head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt

      - name: Validate source syntax
        run: |
          python -m py_compile \
            analysis/build_worldclass_metals.py \
            analysis/build_worldclass_bundle.py \
            analysis/build_worldclass_backtest.py \
            analysis/build_worldclass_regime_backtest.py \
            analysis/validate_worldclass_release.py \
            analysis/macro_liquidity_expansion.py \
            analysis/macro_liquidity_expansion_v12.py \
            analysis/treasury_cash_flow_extension.py \
            analysis/treasury_auction_absorption.py \
            analysis/test_macro_liquidity_parsers.py
          node --check analysis/worldclass/app.js
          node --check analysis/worldclass/bootstrap.js
          node --check analysis/worldclass/decision-system.js
          node --check analysis/worldclass/macro-control-fallback.js
          node --check analysis/worldclass/macro-state-renderer.js
          node --check analysis/worldclass/macro-live-sources.js
          python analysis/test_macro_liquidity_parsers.py

      - name: Build compact browser bundle
        run: |
          python analysis/build_worldclass_bundle.py
          test -s analysis/worldclass/base.json

      - name: Measure compact bundle components
        run: |
          python - <<'PY'
          import gzip
          import json
          from pathlib import Path
          payload = json.loads(Path('analysis/worldclass/base.json').read_text())
          for key, value in sorted(payload.items()):
              raw = json.dumps(value, separators=(',', ':')).encode()
              print(f'BUNDLE_COMPONENT {key}: raw={len(raw):,} gzip={len(gzip.compress(raw, compresslevel=9)):,}')
          PY

      - name: Build Gold and Silver dataset
        run: |
          python analysis/build_worldclass_metals.py
          test -s analysis/worldclass/metals.json

      - name: Build macro liquidity payload
        run: |
          python analysis/macro_liquidity_expansion_v12.py
          test -s analysis/model_output/macro_liquidity_expansion.json

      - name: Build walk-forward backtests
        run: |
          python analysis/build_worldclass_backtest.py
          python analysis/build_worldclass_regime_backtest.py
          test -s analysis/worldclass/backtest.json
          test -s analysis/worldclass/regime_backtest.json

      - name: Validate release contracts
        run: |
          python analysis/validate_worldclass_release.py
          test -s analysis/worldclass/release-status.json
          cat analysis/worldclass/release-status.json

      - name: Prepare production index
        run: cp analysis/worldclass_dashboard.html analysis/index.html

      - name: Publish repaired production tree
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./analysis
          force_orphan: true

      - name: Verify repaired gh-pages contract
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            worldclass/base.json \
            worldclass/metals.json \
            worldclass/release-status.json \
            model_output/macro_liquidity_expansion.json \
            worldclass/bootstrap.js \
            worldclass/macro-state-renderer.js \
            index.html
          do
            size="$(gh api "/repos/${{ github.repository }}/contents/${path}?ref=gh-pages" --jq '.size')"
            test "$size" -gt 0
            echo "Published ${path}: ${size} bytes"
          done

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST /repos/${{ github.repository }}/pages/builds
