name: Dashboard runtime payload CI

on:
  pull_request:
    paths:
      - "analysis/worldclass/**"
      - "analysis/worldclass_dashboard.html"
      - "analysis/validate_worldclass_release.py"
      - ".github/workflows/runtime-payload-ci.yml"

permissions:
  contents: read

jobs:
  first-render-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore current production data payloads
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=1
          mkdir -p analysis/worldclass analysis/model_output
          for path in \
            worldclass/base.json \
            worldclass/metals.json \
            worldclass/regime_backtest.json \
            worldclass/release-status.json \
            worldclass/market-sentiment.json \
            worldclass/live-track-record.json \
            model_output/macro_liquidity_expansion.json
          do
            target="analysis/${path}"
            mkdir -p "$(dirname "${target}")"
            git show "origin/gh-pages:${path}" > "${target}" 2>/dev/null || rm -f "${target}"
          done
          test -s analysis/worldclass/base.json
          test -s analysis/worldclass/metals.json
          test -s analysis/worldclass/regime_backtest.json
          test -s analysis/model_output/macro_liquidity_expansion.json

      - name: Enforce measured first-render gzip budget
        env:
          WORLDCLASS_INITIAL_GZIP_BUDGET: "1000000"
        run: |
          PYTHONPATH=analysis python - <<'PY'
          import json
          import validate_worldclass_release as release

          sizes = release.validate_performance_budget()
          print(json.dumps(sizes, indent=2, sort_keys=True))
          print(f"Measured first-render payload: {sizes['initial_total']:,} / {sizes['budget']:,} gzip bytes")
          PY
