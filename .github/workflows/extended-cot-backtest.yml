name: Extended COT predictivity backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone selected branch
        env:
          GH_TOKEN: ${{ github.token }}
          REF_BRANCH: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$REF_BRANCH" \
            "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repo

      - name: Install analysis dependencies
        working-directory: repo
        run: python3 -m pip install --upgrade pip numpy pandas

      - name: Compile backtest
        working-directory: repo
        run: python3 -m py_compile analysis/cot_extended_predictivity.py

      - name: Run extended COT backtest
        working-directory: repo
        run: >-
          python3 analysis/cot_extended_predictivity.py
          --min-history 104
          --ridge-min-train 156
          --ridge-alpha 8.0

      - name: Commit real-data results to selected branch
        working-directory: repo
        env:
          REF_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analysis/cot_extended_predictivity_output/
          if git diff --cached --quiet; then
            echo "Backtest outputs are unchanged."
            exit 0
          fi
          git commit -m "Add extended COT backtest results"
          git push origin "HEAD:${REF_BRANCH}"
