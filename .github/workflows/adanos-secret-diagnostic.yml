name: Adanos secret diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/adanos-secret-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
    steps:
      - name: Verify secret presence and Adanos authentication
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${ADANOS_API_KEY:-}" ]; then
            echo "ADANOS_SECRET_PRESENT=false"
            exit 2
          fi
          echo "ADANOS_SECRET_PRESENT=true"
          today="$(date -u +%F)"
          status="$(curl -sS -o /tmp/adanos-response.json -w '%{http_code}' \
            -H "X-API-Key: ${ADANOS_API_KEY}" \
            -H 'Accept: application/json' \
            -H 'User-Agent: cot-report-secret-diagnostic/1.0' \
            "https://api.adanos.org/reddit/stocks/v1/market-sentiment?from=${today}&to=${today}" || true)"
          echo "ADANOS_HTTP_STATUS=${status}"
          if [ "$status" -ge 200 ] && [ "$status" -lt 300 ]; then
            echo "ADANOS_AUTH=PASS"
          else
            echo "ADANOS_AUTH=FAIL"
            exit 3
          fi
