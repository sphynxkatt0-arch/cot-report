name: Analog robustness CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/evaluate_analog_robustness*'
      - 'analysis/build_worldclass_backtest.py'
      - 'analysis/cftc_release_calendar.py'
      - 'analysis/cot_release_alignment_v2.py'
      - '.github/workflows/analog-robustness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analog-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r analysis/requirements.txt
      - name: Restore full-history research sources
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          cd analysis
          python - <<'PY'
          import build_worldclass_research_artifacts as r
          r.WORLDCLASS.mkdir(parents=True,exist_ok=True)
          r.atomic_write(r.WORLDCLASS/'base.json',r.build_research_base())
          metals=r.ensure_full_metals();r.atomic_write(r.WORLDCLASS/'metals.json',metals)
          PY
      - name: Run release-corrected analog robustness
        working-directory: analysis
        run: python evaluate_analog_robustness_v2.py
      - name: Validate analog v2 contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path('analysis/worldclass/research/analog-robustness.json')
          assert path.is_file() and path.stat().st_size>1000
          p=json.loads(path.read_text())
          assert p['research_generation']=='release-corrected-v2'
          assert p['information_contract_version']=='cftc-public-availability-v2'
          assert p['release_calendar_hash']
          assert p['automatic_promotion_allowed'] is False
          assert set(p['markets']) >= {'sp500','nq','vix','rty','dow','gold','silver'}
          assert p['methodology']['unresolved_release_policy']=='EXCLUDE'
          print('Analog robustness v2 PASS')
          PY
