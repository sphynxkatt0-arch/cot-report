name: COT raw position and OI predictive power CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/evaluate_cot_raw_position_oi_predictive_power*'
      - 'analysis/evaluate_cot_actor_predictive_power*'
      - 'analysis/build_cot_actor_event_research*'
      - 'analysis/cftc_release_calendar.py'
      - 'analysis/cot_release_alignment_v2.py'
      - '.github/workflows/cot-raw-position-oi-predictive-power-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  raw-position-oi-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r analysis/requirements.txt
      - name: Restore full-history research sources
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          cd analysis
          python - <<'PY'
          import build_worldclass_research_artifacts as r
          r.WORLDCLASS.mkdir(parents=True,exist_ok=True)
          r.atomic_write(r.WORLDCLASS/'base.json',r.build_research_base())
          metals=r.ensure_full_metals();r.atomic_write(r.WORLDCLASS/'metals.json',metals)
          PY
      - name: Run release-corrected raw position/OI study
        working-directory: analysis
        run: python evaluate_cot_raw_position_oi_predictive_power_v2.py
      - name: Validate v2 raw/OI contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          full=Path('analysis/worldclass/research/cot-raw-position-oi-predictive-power.json')
          summary=Path('analysis/worldclass/research/cot-raw-position-oi-predictive-power-summary.json')
          assert full.is_file() and full.stat().st_size>100_000
          p=json.loads(full.read_text());s=json.loads(summary.read_text())
          assert p['research_generation']=='release-corrected-v2'
          assert p['information_contract_version']=='cftc-public-availability-v2'
          assert p['strict_release_alignment'] is True
          assert p['release_calendar_hash']
          assert s['research_generation']=='release-corrected-v2'
          assert p.get('actor_series')
          assert p.get('continuous_metrics') or p.get('metric_count') or p.get('actor_series')
          print('Release-corrected raw position/OI predictive power PASS')
          PY
