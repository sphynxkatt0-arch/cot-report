name: COT raw position and OI predictive power CI

on:
  push:
    branches:
      - research/full-actor-cross-instrument-20260810
    paths:
      - "analysis/evaluate_cot_raw_position_oi_predictive_power.py"
      - "analysis/evaluate_cot_actor_predictive_power.py"
      - "analysis/build_cot_actor_event_research.py"
      - "analysis/evaluate_analog_robustness.py"
      - "analysis/build_worldclass_research_artifacts.py"
      - "analysis/build_worldclass_backtest.py"
      - ".github/workflows/cot-raw-position-oi-predictive-power-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "analysis/evaluate_cot_raw_position_oi_predictive_power.py"
      - "analysis/evaluate_cot_actor_predictive_power.py"
      - "analysis/build_cot_actor_event_research.py"
      - "analysis/evaluate_analog_robustness.py"
      - "analysis/build_worldclass_research_artifacts.py"
      - "analysis/build_worldclass_backtest.py"
      - ".github/workflows/cot-raw-position-oi-predictive-power-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  raw-position-oi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch persistent full-history metals source
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages || true

      - name: Syntax
        run: |
          python -m py_compile \
            analysis/evaluate_cot_raw_position_oi_predictive_power.py \
            analysis/evaluate_cot_actor_predictive_power.py \
            analysis/build_cot_actor_event_research.py

      - name: Run raw position and OI predictive-power study
        working-directory: analysis
        run: python evaluate_cot_raw_position_oi_predictive_power.py

      - name: Validate raw position and OI research contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          full_path = Path("analysis/worldclass/research/cot-raw-position-oi-predictive-power.json")
          summary_path = Path("analysis/worldclass/research/cot-raw-position-oi-predictive-power-summary.json")
          assert full_path.is_file() and full_path.stat().st_size > 500_000
          assert summary_path.is_file() and summary_path.stat().st_size > 100_000
          p = json.loads(full_path.read_text(encoding="utf-8"))
          s = json.loads(summary_path.read_text(encoding="utf-8"))

          assert p["information_contract"]["lookahead_safe"] is True
          assert p["information_contract"]["cot_snapshot"] == "Tuesday"
          assert p["information_contract"]["public_availability"].startswith("Friday")
          assert p["forecast_contract"]["discovery"] == "pre-2022"
          assert p["forecast_contract"]["holdout"] == "2022+ untouched"
          assert p["actor_series_count"] == 59, p["actor_series_count"]
          assert p["dataset_market_oi_series_count"] == 7, p["dataset_market_oi_series_count"]
          expected_metric_count = 59 * 14 * 15 + 7 * 5 * 15
          assert p["continuous_metric_count"] == expected_metric_count, p["continuous_metric_count"]
          assert sum(p["strict_counts"].values()) == expected_metric_count

          expected_actor = {
              "net_contracts", "long_contracts", "short_contracts", "net_contracts_percentile",
              "delta_net_contracts", "delta_long_contracts", "delta_short_contracts",
              "signed_delta_net_contracts_percentile", "net_oi_pct", "long_oi_pct", "short_oi_pct",
              "delta_1w_net_oi_pp", "position_percentile", "signed_change_percentile",
          }
          expected_oi = {
              "open_interest", "open_interest_percentile", "delta_open_interest",
              "delta_open_interest_pct", "signed_delta_open_interest_percentile",
          }
          assert set(p["actor_predictors"]) == expected_actor
          assert set(p["oi_predictors"]) == expected_oi
          assert set(p["augmented_model_specs"]) == {
              "raw_net_flow_plus_oi_pct", "net_oi_flow_plus_oi_pct",
              "position_ratio_plus_oi_level", "signed_flow_percentiles",
          }
          for horizon in ("monday","tuesday","wednesday","thursday","friday","1w","2w","3w","4w","6w","8w","13w","26w","39w","52w"):
              assert horizon in p["horizons"]
          for key in (
              "disaggregated:gold:managed_money",
              "disaggregated:silver:managed_money",
              "tff:nq:asset_mgr",
              "tff:sp500:asset_mgr",
          ):
              assert key in p["actor_series"], key
          for key in ("tff:sp500", "tff:nq", "tff:vix", "tff:rty", "tff:dow", "disaggregated:gold", "disaggregated:silver"):
              assert key in p["oi_series"], key
          assert s["gold_managed_money_all_horizons"]
          assert s["top_oi_metrics"]
          assert s["top_raw_actor_metrics"]
          assert s["top_oi_incremental_models"]
          assert s["top_actor_flow_x_oi_interactions"]
          assert all("global_fdr_q" in row and "family_fdr_q" in row for row in s["top_strict_all"])

          print("COT raw position/OI research contract PASS")
          print("actor_series", p["actor_series_count"])
          print("oi_series", p["dataset_market_oi_series_count"])
          print("continuous_metrics", p["continuous_metric_count"])
          print("strict_counts", json.dumps(p["strict_counts"], sort_keys=True))
          PY

      - name: Freeze raw position and OI verification snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/full-actor-cross-instrument-20260810'
        env:
          SNAPSHOT_DIR: analysis/worldclass/research/snapshots/2026-08-11-position-oi
        run: |
          set -euo pipefail
          mkdir -p "$SNAPSHOT_DIR"
          if [ -f "$SNAPSHOT_DIR/verification-manifest.json" ]; then
            echo "Raw position/OI snapshot already frozen; leaving it immutable"
            exit 0
          fi

          cp analysis/worldclass/research/cot-raw-position-oi-predictive-power-summary.json \
             "$SNAPSHOT_DIR/cot-raw-position-oi-predictive-power-summary.json"

          python - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          snap = Path(os.environ["SNAPSHOT_DIR"])
          full = Path("analysis/worldclass/research/cot-raw-position-oi-predictive-power.json")
          summary = Path("analysis/worldclass/research/cot-raw-position-oi-predictive-power-summary.json")
          compressed = snap / "cot-raw-position-oi-predictive-power.json.gz"
          compressed.write_bytes(gzip.compress(full.read_bytes(), compresslevel=9, mtime=0))

          payload = json.loads(full.read_text(encoding="utf-8"))
          compact = json.loads(summary.read_text(encoding="utf-8"))
          gold_rows = compact.get("gold_managed_money_all_horizons") or []
          gold_path = snap / "gold-managed-money-position-oi-horizons.json"
          gold_path.write_text(json.dumps({
              "series": "disaggregated:gold:managed_money",
              "information_contract": payload.get("information_contract"),
              "rows": gold_rows,
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def canonical_sha(path: Path) -> str:
              obj = json.loads(path.read_text(encoding="utf-8"))
              if isinstance(obj, dict):
                  obj.pop("generated_at_utc", None)
              canonical = json.dumps(obj, sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode("utf-8")
              return hashlib.sha256(canonical).hexdigest()

          def git(ref: str) -> str:
              return subprocess.check_output(["git", "rev-parse", ref], text=True).strip()

          manifest = {
              "snapshot_id": "cot-raw-position-oi-predictive-power-2026-08-11",
              "purpose": "Frozen raw contract-count, open-interest, interaction, and incremental-OI predictive-power verification baseline.",
              "research_branch": "research/full-actor-cross-instrument-20260810",
              "research_head_before_snapshot_commit": os.environ.get("GITHUB_SHA"),
              "main_ref_sha": git("origin/main"),
              "gh_pages_source_ref_sha": git("origin/gh-pages"),
              "workflow_run_id": os.environ.get("GITHUB_RUN_ID"),
              "information_contract": payload.get("information_contract"),
              "forecast_contract": payload.get("forecast_contract"),
              "actor_predictors": payload.get("actor_predictors"),
              "oi_predictors": payload.get("oi_predictors"),
              "augmented_model_specs": payload.get("augmented_model_specs"),
              "interaction_contract": payload.get("interaction_contract"),
              "horizons": payload.get("horizons"),
              "actor_series_count": payload.get("actor_series_count"),
              "market_oi_series_count": payload.get("dataset_market_oi_series_count"),
              "continuous_metric_count": payload.get("continuous_metric_count"),
              "strict_counts": payload.get("strict_counts"),
              "verification_rule": "Raw hashes prove stored-file integrity. For identical source-state SHAs/code, compare canonical JSON hashes excluding only generated_at_utc. When source data advances, preserve this snapshot and compare only the frozen historical boundary.",
              "files": {
                  "full_json_uncompressed": {"bytes": full.stat().st_size, "sha256": sha256(full), "canonical_sha256_excluding_generated_at_utc": canonical_sha(full)},
                  "full_json_gzip": {"bytes": compressed.stat().st_size, "sha256": sha256(compressed)},
                  "summary_json": {"bytes": summary.stat().st_size, "sha256": sha256(summary), "canonical_sha256": canonical_sha(summary)},
                  "gold_managed_money_json": {"bytes": gold_path.stat().st_size, "sha256": sha256(gold_path), "canonical_sha256": canonical_sha(gold_path)},
              },
              "production_changes": False,
          }
          manifest_path = snap / "verification-manifest.json"
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          sums = [
              f"{sha256(compressed)}  cot-raw-position-oi-predictive-power.json.gz",
              f"{sha256(summary)}  cot-raw-position-oi-predictive-power-summary.json",
              f"{sha256(gold_path)}  gold-managed-money-position-oi-horizons.json",
              f"{sha256(manifest_path)}  verification-manifest.json",
          ]
          (snap / "SHA256SUMS.txt").write_text("\n".join(sums) + "\n", encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$SNAPSHOT_DIR/cot-raw-position-oi-predictive-power.json.gz" \
                     "$SNAPSHOT_DIR/cot-raw-position-oi-predictive-power-summary.json" \
                     "$SNAPSHOT_DIR/gold-managed-money-position-oi-horizons.json" \
                     "$SNAPSHOT_DIR/verification-manifest.json" \
                     "$SNAPSHOT_DIR/SHA256SUMS.txt"
          git commit -m "research: freeze raw position and OI predictive snapshot [skip ci]"
          git push origin "HEAD:research/full-actor-cross-instrument-20260810"
