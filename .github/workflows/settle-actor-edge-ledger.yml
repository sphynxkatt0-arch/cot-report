name: Settle Actor Edge Ledger

on:
  workflow_run:
    workflows: ["Settle Live Ledger"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  settle:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install dependencies and validate code
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt
          python -m py_compile analysis/live/actor_edge_ledger.py analysis/live/settle_actor_edge_live_signals.py analysis/live/build_actor_edge_track_record.py analysis/live/merge_actor_edge_track_record.py analysis/live/validate_actor_edge_ledger.py analysis/test_actor_edge_live_ledger.py
          python analysis/test_actor_edge_live_ledger.py
      - name: Refresh price-bearing sources
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python analysis/serve_interactive_cot_dashboard.py --refresh-only
          python analysis/build_worldclass_metals.py
      - name: Settle newly matured actor-edge evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-live-ledger /tmp/actor-edge-settlement.json
          git fetch origin live-ledger:refs/remotes/origin/live-ledger
          git worktree add --detach /tmp/cot-live-ledger origin/live-ledger
          python analysis/live/validate_live_ledger.py --ledger-root /tmp/cot-live-ledger --verify-git-history
          python analysis/live/validate_actor_edge_ledger.py --ledger-root /tmp/cot-live-ledger
          python analysis/live/settle_actor_edge_live_signals.py --ledger-root /tmp/cot-live-ledger --metadata-out /tmp/actor-edge-settlement.json
          created="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/actor-edge-settlement.json').read_text())
          print(int(p.get('created_entry_count') or 0)+int(p.get('created_outcome_count') or 0))
          PY
          )"
          if [ "$created" -gt 0 ]; then
            git -C /tmp/cot-live-ledger config user.name "github-actions[bot]"
            git -C /tmp/cot-live-ledger config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C /tmp/cot-live-ledger add live/actor_edge/entries live/actor_edge/outcomes
            git -C /tmp/cot-live-ledger commit -m "Settle matured COT actor-edge evidence"
            python analysis/live/validate_actor_edge_ledger.py --ledger-root /tmp/cot-live-ledger
            git -C /tmp/cot-live-ledger push origin HEAD:live-ledger
          else
            echo "No actor-edge entry or horizon matured from available closes."
          fi
          python analysis/live/build_actor_edge_track_record.py --ledger-root /tmp/cot-live-ledger --output /tmp/actor-edge-live-track-record.json
      - name: Publish merged live evidence snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-gh-pages
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach /tmp/cot-gh-pages origin/gh-pages
          test -s /tmp/cot-gh-pages/worldclass/live-track-record.json
          python analysis/live/merge_actor_edge_track_record.py --core /tmp/cot-gh-pages/worldclass/live-track-record.json --edge /tmp/actor-edge-live-track-record.json --output /tmp/cot-gh-pages/worldclass/live-track-record.json
          git -C /tmp/cot-gh-pages config user.name "github-actions[bot]"
          git -C /tmp/cot-gh-pages config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/cot-gh-pages add worldclass/live-track-record.json
          if git -C /tmp/cot-gh-pages diff --cached --quiet; then echo "Actor-edge live snapshot already current."; exit 0; fi
          git -C /tmp/cot-gh-pages commit -m "Settle prospective actor-edge track record"
          git -C /tmp/cot-gh-pages push origin HEAD:gh-pages
