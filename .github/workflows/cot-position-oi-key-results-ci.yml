name: COT position and OI key-results CI

on:
  push:
    branches:
      - research/full-actor-cross-instrument-20260810
    paths:
      - "analysis/extract_position_oi_key_results.py"
      - ".github/workflows/cot-position-oi-key-results-ci.yml"
  pull_request:
    branches:
      - main
    paths:
      - "analysis/extract_position_oi_key_results.py"
      - ".github/workflows/cot-position-oi-key-results-ci.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  key-results:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch persistent full-history metals source
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages || true

      - name: Syntax
        run: |
          python -m py_compile \
            analysis/evaluate_cot_raw_position_oi_predictive_power.py \
            analysis/extract_position_oi_key_results.py

      - name: Regenerate governed raw-position/OI study
        working-directory: analysis
        run: python evaluate_cot_raw_position_oi_predictive_power.py

      - name: Extract compact audit results
        working-directory: analysis
        run: python extract_position_oi_key_results.py

      - name: Validate compact audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("analysis/worldclass/research/snapshots/2026-08-11-position-oi-derived/key-results.json")
          assert p.is_file() and p.stat().st_size > 20_000
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["continuous_metric_count"] == 12915
          assert d["oi_only_by_horizon"]["1w"]
          assert d["oi_only_by_horizon"]["4w"]
          assert len(d["gold_managed_money_continuous"]["1w"]) == 14
          assert d["gold_managed_money_incremental_oi_models"]
          assert d["gold_managed_money_flow_x_oi_interactions"]
          assert d["top_short_horizon_incremental_oi_models_n30"]
          print("Position/OI compact audit PASS")
          print("bytes", p.stat().st_size)
          PY

      - name: Freeze compact derived audit
        if: github.event_name == 'push' && github.ref == 'refs/heads/research/full-actor-cross-instrument-20260810'
        run: |
          set -euo pipefail
          target="analysis/worldclass/research/snapshots/2026-08-11-position-oi-derived/key-results.json"
          sumfile="analysis/worldclass/research/snapshots/2026-08-11-position-oi-derived/SHA256SUM.txt"
          sha256sum "$target" | sed 's#analysis/worldclass/research/snapshots/2026-08-11-position-oi-derived/##' > "$sumfile"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$target" "$sumfile"
          if git diff --cached --quiet; then
            echo "Derived audit unchanged"
            exit 0
          fi
          git commit -m "research: freeze position and OI key-results audit [skip ci]"
          git pull --rebase origin research/full-actor-cross-instrument-20260810
          git push origin "HEAD:research/full-actor-cross-instrument-20260810"
