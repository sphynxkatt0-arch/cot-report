name: Directional COT tests

on:
  pull_request:
    paths:
      - "analysis/**/*.py"
      - "analysis/config/**"
      - "analysis/requirements.txt"
      - ".github/workflows/directional-cot-tests.yml"
  push:
    paths:
      - "analysis/**/*.py"
      - "analysis/config/**"
      - "analysis/requirements.txt"
      - ".github/workflows/directional-cot-tests.yml"

permissions:
  contents: read

concurrency:
  group: directional-cot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: analysis

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run all directional regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
