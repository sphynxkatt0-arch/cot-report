name: Refresh Daily Market Sentiment

on:
  workflow_dispatch:
  schedule:
    # Exactly one maps to 23:45 Europe/Stockholm across DST.
    - cron: "45 21 * * *"
    - cron: "45 22 * * *"

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          schedule_expr='${{ github.event.schedule }}'
          utc_day="$(date -u +%F)"
          case "$schedule_expr" in
            "45 21 * * *") scheduled_utc="$utc_day 21:45:00 UTC" ;;
            "45 22 * * *") scheduled_utc="$utc_day 22:45:00 UTC" ;;
            *) echo "run=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          scheduled_local="$(TZ=Europe/Stockholm date -d "$scheduled_utc" +%H:%M)"
          if [ "$scheduled_local" = "23:45" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  collect:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate collector
        run: |
          python -m py_compile analysis/sentiment/adanos_daily.py analysis/sentiment/build_market_sentiment_history.py analysis/test_market_sentiment.py
          python analysis/test_market_sentiment.py

      - name: Require Adanos API secret
        env:
          ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
        run: |
          if [ -z "${ADANOS_API_KEY}" ]; then
            echo "::error::Repository secret ADANOS_API_KEY is required."
            exit 1
          fi

      - name: Append immutable daily source snapshot
        env:
          ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-sentiment-ledger
          git fetch origin sentiment-ledger:refs/remotes/origin/sentiment-ledger
          git worktree add --detach /tmp/cot-sentiment-ledger origin/sentiment-ledger
          python analysis/sentiment/adanos_daily.py --ledger-root /tmp/cot-sentiment-ledger
          git -C /tmp/cot-sentiment-ledger config user.name "github-actions[bot]"
          git -C /tmp/cot-sentiment-ledger config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/cot-sentiment-ledger add sentiment
          if ! git -C /tmp/cot-sentiment-ledger diff --cached --quiet; then
            git -C /tmp/cot-sentiment-ledger commit -m "Append daily Adanos market sentiment"
            git -C /tmp/cot-sentiment-ledger push origin HEAD:sentiment-ledger
          fi

      - name: Build compact presentation history
        run: |
          python analysis/sentiment/build_market_sentiment_history.py \
            --ledger-root /tmp/cot-sentiment-ledger \
            --output /tmp/market-sentiment.json
          test -s /tmp/market-sentiment.json

      - name: Publish sentiment snapshot to Pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-gh-pages-sentiment
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach /tmp/cot-gh-pages-sentiment origin/gh-pages
          mkdir -p /tmp/cot-gh-pages-sentiment/worldclass
          cp /tmp/market-sentiment.json /tmp/cot-gh-pages-sentiment/worldclass/market-sentiment.json
          git -C /tmp/cot-gh-pages-sentiment config user.name "github-actions[bot]"
          git -C /tmp/cot-gh-pages-sentiment config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/cot-gh-pages-sentiment add worldclass/market-sentiment.json
          if git -C /tmp/cot-gh-pages-sentiment diff --cached --quiet; then
            echo "Published market sentiment already matches the ledger."
            exit 0
          fi
          git -C /tmp/cot-gh-pages-sentiment commit -m "Update daily market sentiment"
          git -C /tmp/cot-gh-pages-sentiment push origin HEAD:gh-pages
