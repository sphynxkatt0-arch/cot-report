name: Market sentiment CI

on:
  pull_request:
    paths:
      - "analysis/sentiment/**"
      - "analysis/test_market_sentiment.py"
      - "analysis/worldclass/sentiment-panel.js"
      - "analysis/worldclass/sentiment-panel.css"
      - "analysis/worldclass/bootstrap.js"
      - ".github/workflows/refresh-market-sentiment.yml"
      - ".github/workflows/sentiment-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax and unit contracts
        run: |
          python -m py_compile analysis/sentiment/adanos_daily.py analysis/sentiment/build_market_sentiment_history.py analysis/test_market_sentiment.py
          python analysis/test_market_sentiment.py
          node --check analysis/worldclass/sentiment-panel.js
          node --check analysis/worldclass/bootstrap.js

      - name: Build presentation payload from immutable fixture history
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/sentiment-ledger-fixture /tmp/market-sentiment-fixture.json
          mkdir -p /tmp/sentiment-ledger-fixture/sentiment/2026
          python - <<'PY'
          import json
          from pathlib import Path
          sources = {}
          for key, score in [('reddit', .2), ('x', .1), ('news', -.05), ('polymarket', .3)]:
              sources[key] = {
                  'source_id': key,
                  'label': key,
                  'status': 'LIVE',
                  'sentiment_score': score,
                  'sentiment_index': (score + 1) * 50,
                  'bullish_pct': 55,
                  'bearish_pct': 20,
                  'buzz_score': 60,
                  'trend': 'stable',
                  'drivers': [{'ticker': 'NVDA', 'buzz_score': 70, 'sentiment_score': score}],
              }
          payload = {
              'schema_version': 1,
              'provider': 'Adanos',
              'observation_date': '2026-08-09',
              'retrieved_at_utc': '2026-08-09T21:45:00Z',
              'composite': {
                  'state': 'LIVE', 'required_sources': 4, 'available_sources': 4,
                  'coverage_ratio': 1.0, 'sentiment_score': .1375,
                  'sentiment_index': 56.875, 'regime': 'NEUTRAL',
                  'bullish_pct': 55, 'bearish_pct': 20, 'buzz_score': 60,
                  'source_disagreement': .13, 'source_weights': {key: .25 for key in sources},
                  'missing_sources': [],
              },
              'sources': sources,
          }
          Path('/tmp/sentiment-ledger-fixture/sentiment/2026/2026-08-09.json').write_text(json.dumps(payload))
          PY
          python analysis/sentiment/build_market_sentiment_history.py \
            --ledger-root /tmp/sentiment-ledger-fixture \
            --output /tmp/market-sentiment-fixture.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/market-sentiment-fixture.json').read_text())
          assert payload['history_count'] == 1
          assert payload['latest']['observation_date'] == '2026-08-09'
          assert set(payload['latest']['sources']) == {'reddit', 'x', 'news', 'polymarket'}
          assert payload['latest']['composite']['state'] == 'LIVE'
          print('Sentiment fixture history validation passed')
          PY
