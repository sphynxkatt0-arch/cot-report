name: Settle Live Ledger

on:
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * 1-5'
    - cron: '30 22 * * 1-5'

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != 'schedule' ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          utc_day="$(date -u +%F)"
          case '${{ github.event.schedule }}' in
            '30 21 * * 1-5') scheduled_utc="$utc_day 21:30:00 UTC" ;;
            '30 22 * * 1-5') scheduled_utc="$utc_day 22:30:00 UTC" ;;
            *) echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          local="$(TZ=Europe/Stockholm date -d "$scheduled_utc" +%H:%M)"
          if [ "$local" = '23:30' ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi

  settle:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - run: pip install -r analysis/requirements.txt
      - name: Validate v2 settlement code
        run: |
          python -m py_compile analysis/live/ledger_v2.py analysis/live/settle_live_signals_v2.py analysis/live/build_live_track_record_v2.py analysis/live/validate_live_ledger_v2.py analysis/test_live_ledger_v2.py
          python analysis/test_live_ledger_v2.py
      - name: Refresh index price source
        id: index_prices
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python analysis/serve_interactive_cot_dashboard.py --refresh-only
      - name: Refresh metal price source
        id: metal_prices
        continue-on-error: true
        run: python analysis/build_worldclass_metals.py
      - name: Settle newly matured evidence on authoritative ledger
        id: settlement
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-live-ledger /tmp/live-settlement.json
          git fetch origin live-ledger:refs/remotes/origin/live-ledger
          git worktree add --detach /tmp/cot-live-ledger origin/live-ledger
          python analysis/live/validate_live_ledger_v2.py --ledger-root /tmp/cot-live-ledger --verify-git-history
          python analysis/live/settle_live_signals_v2.py --ledger-root /tmp/cot-live-ledger --metadata-out /tmp/live-settlement.json
          created="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/live-settlement.json').read_text());print(int(p.get('created_entry_count') or 0)+int(p.get('created_outcome_count') or 0))
          PY
          )"
          echo "created=$created" >> "$GITHUB_OUTPUT"
          if [ "$created" -eq 0 ]; then python analysis/live/validate_live_ledger_v2.py --ledger-root /tmp/cot-live-ledger --verify-git-history; exit 0; fi
          git -C /tmp/cot-live-ledger config user.name 'github-actions[bot]'
          git -C /tmp/cot-live-ledger config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/cot-live-ledger add live/entries live/outcomes
          git -C /tmp/cot-live-ledger commit -m 'Settle matured release-corrected live COT evidence'
          python analysis/live/validate_live_ledger_v2.py --ledger-root /tmp/cot-live-ledger --verify-git-history
          git -C /tmp/cot-live-ledger push origin HEAD:live-ledger
      - name: Build v2-validated presentation track record
        shell: bash
        run: |
          set -euo pipefail
          python analysis/live/validate_live_ledger_v2.py --ledger-root /tmp/cot-live-ledger --verify-git-history
          python analysis/live/build_live_track_record_v2.py --ledger-root /tmp/cot-live-ledger --output /tmp/live-track-record.json
          test -s /tmp/live-track-record.json
      - name: Publish track-record snapshot to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-gh-pages
          git fetch origin gh-pages:refs/remotes/origin/gh-pages
          git worktree add --detach /tmp/cot-gh-pages origin/gh-pages
          mkdir -p /tmp/cot-gh-pages/worldclass
          cp /tmp/live-track-record.json /tmp/cot-gh-pages/worldclass/live-track-record.json
          git -C /tmp/cot-gh-pages config user.name 'github-actions[bot]'
          git -C /tmp/cot-gh-pages config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/cot-gh-pages add worldclass/live-track-record.json
          if git -C /tmp/cot-gh-pages diff --cached --quiet; then exit 0; fi
          git -C /tmp/cot-gh-pages commit -m 'Update v2-validated live COT track record'
          git -C /tmp/cot-gh-pages push origin HEAD:gh-pages
