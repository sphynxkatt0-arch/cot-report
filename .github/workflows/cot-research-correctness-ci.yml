name: COT research correctness

on:
  pull_request:
    paths:
      - 'analysis/**'
      - '.github/workflows/cot-research-correctness-ci.yml'
  push:
    branches: [main, fix/cot-release-correctness-v2]
    paths:
      - 'analysis/**'
      - '.github/workflows/cot-research-correctness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Compile corrected research modules
        working-directory: analysis
        run: |
          python -m py_compile \
            cftc_release_calendar.py cot_release_alignment_v2.py cot_research_core.py cftc_release_tracker.py \
            build_worldclass_backtest.py build_worldclass_regime_backtest.py build_cot_actor_event_research_release_corrected.py \
            evaluate_cot_threshold_inference_v2.py evaluate_cot_actor_predictive_power_v2.py evaluate_cot_raw_position_oi_predictive_power_v2.py \
            evaluate_actor_weights_walkforward_v2.py validate_directional_cot_v2.py validate_worldclass_release_v2.py \
            build_cot_current_state.py build_cot_edge_details_v2.py build_cot_edge_registry_v2.py build_cot_active_edges_v2.py build_cot_cross_market_runtime_v2.py \
            macro_direction_adapter.py cot_direction_model.py build_release_manifest.py tests/test_governed_cot_contract.py \
            live/actor_edge_ledger.py live/generate_actor_edge_live_forecasts.py live/ledger_v2.py live/generate_live_forecasts_v2.py \
            live/apply_live_forecasts_v2.py live/append_ledger_manifest_v2.py live/validate_live_ledger_v2.py live/settle_live_signals_v2.py \
            validate_cot_research_correctness.py

  timing-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Prove canonical CFTC availability and price alignment
        working-directory: analysis
        run: python validate_cot_research_correctness.py

  calendar-artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical calendar provenance
        run: |
          set -euo pipefail
          test -s analysis/reference/cftc_release_calendar.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('analysis/reference/cftc_release_calendar.json').read_text())
          assert p['schema_version']==2
          assert p['calendar_version']=='cftc-release-v3-2026-08-11'
          assert len(p['exceptions']) >= 30
          assert p['exceptions']['2018-12-24']['release_date']=='2019-02-01'
          assert p['exceptions']['2023-01-31']['release_date']=='2023-02-24'
          assert p['exceptions']['2025-09-30']['release_date']=='2025-11-19'
          PY
