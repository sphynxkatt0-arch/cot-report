name: COT research correctness

on:
  pull_request:
    paths:
      - 'analysis/**'
      - '.github/workflows/cot-research-correctness-ci.yml'
  push:
    branches:
      - main
      - fix/cot-release-correctness-v2
    paths:
      - 'analysis/**'
      - '.github/workflows/cot-research-correctness-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anti-lookahead:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile corrected research modules
        working-directory: analysis
        run: |
          python -m py_compile \
            cftc_release_calendar.py \
            cot_research_core.py \
            cftc_release_tracker.py \
            build_worldclass_backtest.py \
            build_worldclass_regime_backtest.py \
            build_cot_actor_event_research_v2.py \
            evaluate_cot_actor_predictive_power_v2.py \
            evaluate_cot_raw_position_oi_predictive_power_v2.py \
            build_cot_current_state.py \
            live/actor_edge_ledger.py \
            live/generate_actor_edge_live_forecasts.py \
            validate_cot_research_correctness.py
      - name: Prove canonical CFTC availability and price alignment
        working-directory: analysis
        run: python validate_cot_research_correctness.py
      - name: Verify canonical calendar is tracked and nonempty
        shell: bash
        run: |
          set -euo pipefail
          test -s analysis/reference/cftc_release_calendar.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('analysis/reference/cftc_release_calendar.json').read_text())
          assert p['calendar_version']
          assert len(p['exceptions']) >= 10
          assert p['exceptions']['2025-09-30']['release_date'] == '2025-11-19'
          PY
