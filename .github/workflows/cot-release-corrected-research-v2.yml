name: COT release-corrected research v2

on:
  push:
    branches: [fix/cot-release-correctness-v2]
    paths:
      - 'analysis/**'
      - '.github/workflows/cot-release-corrected-research-v2.yml'
  pull_request:
    branches: [main]
    paths:
      - 'analysis/**'
      - '.github/workflows/cot-release-corrected-research-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r analysis/requirements.txt
      - name: Fetch persistent research sources
        run: git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
      - name: Compile v2 orchestration and live-ledger cutover
        working-directory: analysis
        run: |
          python -m py_compile \
            build_release_corrected_research_v2.py cftc_release_calendar.py cot_release_alignment_v2.py cot_research_core.py \
            build_worldclass_backtest.py build_worldclass_regime_backtest.py build_cot_actor_event_research_release_corrected.py \
            evaluate_cot_threshold_inference_v2.py evaluate_cot_actor_predictive_power_v2.py evaluate_cot_raw_position_oi_predictive_power_v2.py \
            evaluate_analog_robustness_v2.py evaluate_financial_actor_weights_v2.py evaluate_disaggregated_weights_v2.py evaluate_actor_weights_walkforward_v2.py \
            validate_directional_cot_v2.py build_cot_current_state.py build_cot_edge_details_v2.py build_cot_edge_registry_v2.py build_cot_active_edges_v2.py \
            build_cot_cross_market_runtime_v2.py build_backtest_correctness_report.py validate_cot_research_correctness.py \
            live/ledger_v2.py live/generate_live_forecasts_v2.py live/apply_live_forecasts_v2.py live/append_ledger_manifest_v2.py live/validate_live_ledger_v2.py live/settle_live_signals_v2.py
      - name: Build and validate entire release-corrected research generation
        working-directory: analysis
        run: python build_release_corrected_research_v2.py
      - name: Validate final research contract
        working-directory: analysis
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('worldclass/research/release-corrected-v2-build-manifest.json').read_text())
          assert manifest['status']=='VALIDATED_BUILD'
          assert manifest['research_generation']=='release-corrected-v2'
          threshold=json.loads(Path('worldclass/research/cot-threshold-inference-v2.json').read_text())
          assert threshold['methodology']['bootstrap_type'].startswith('circular moving-block')
          registry=json.loads(Path('worldclass/cot-edge-registry-v2.json').read_text())
          assert len(registry['actors'])==59
          assert registry['research_counts']['actor_horizon_cells']==885
          assert registry['research_counts']['market_oi_horizon_cells']==105
          assert registry['automatic_promotion_allowed'] is False
          active=json.loads(Path('worldclass/cot-active-edges-v2.json').read_text())
          assert active['automatic_promotion_allowed'] is False
          directional=json.loads(Path('worldclass/research/directional-validation-v2.json').read_text())
          assert len(directional['metrics'])==8
          weights=json.loads(Path('worldclass/research/actor-weight-walkforward-v2.json').read_text())
          assert set(weights['families'])=={'financial_tff','financial_legacy','metals_disaggregated'}
          cross=json.loads(Path('worldclass/cot-cross-market-v2.json').read_text())
          assert cross['governance']['status']=='DISCOVERY_ONLY'
          print('Complete release-corrected v2 contract PASS')
          PY
      - name: Package candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          SNAP=analysis/worldclass/research/candidate-snapshots/2026-08-11-release-corrected-v2
          rm -rf "$SNAP"; mkdir -p "$SNAP/cot-edge-details-v2"
          cp analysis/worldclass/backtest.json "$SNAP/worldclass-backtest.json"
          cp analysis/worldclass/regime_backtest.json "$SNAP/worldclass-regime-backtest.json"
          cp analysis/worldclass/research/analog-robustness.json "$SNAP/analog-robustness.json"
          cp analysis/worldclass/financial-weight-study.json "$SNAP/financial-weight-study.json"
          cp analysis/worldclass/metal-weight-study.json "$SNAP/metal-weight-study.json"
          cp analysis/worldclass/research/actor-weight-walkforward-v2.json "$SNAP/actor-weight-walkforward-v2.json"
          cp analysis/worldclass/research/directional-validation-v2.json "$SNAP/directional-validation-v2.json"
          cp analysis/worldclass/cot-current-state.json "$SNAP/cot-current-state-build-time.json"
          cp analysis/worldclass/cot-edge-registry-v2.json "$SNAP/cot-edge-registry-v2.json"
          cp analysis/worldclass/cot-active-edges-v2.json "$SNAP/cot-active-edges-build-time-v2.json"
          cp analysis/worldclass/cot-cross-market-v2.json "$SNAP/cot-cross-market-v2.json"
          cp analysis/worldclass/research/cot-position-oi-audit-v2.json "$SNAP/cot-position-oi-audit-v2.json"
          cp analysis/worldclass/cot-edge-details-v2/*.json "$SNAP/cot-edge-details-v2/"
          cp analysis/worldclass/research/BACKTEST_CORRECTNESS_REPORT.md "$SNAP/BACKTEST_CORRECTNESS_REPORT.md"
          cp analysis/worldclass/research/release-corrected-v2-build-manifest.json "$SNAP/build-manifest.json"
          cp analysis/worldclass/research/cot-actor-event-summary.json "$SNAP/cot-actor-event-summary.json"
          gzip -9 -c analysis/worldclass/research/cot-actor-event-research.json > "$SNAP/cot-actor-event-research.json.gz"
          cp analysis/worldclass/research/cot-threshold-inference-v2-summary.json "$SNAP/cot-threshold-inference-v2-summary.json"
          gzip -9 -c analysis/worldclass/research/cot-threshold-inference-v2.json > "$SNAP/cot-threshold-inference-v2.json.gz"
          cp analysis/worldclass/research/cot-actor-predictive-power-summary.json "$SNAP/cot-actor-predictive-power-summary.json"
          gzip -9 -c analysis/worldclass/research/cot-actor-predictive-power.json > "$SNAP/cot-actor-predictive-power.json.gz"
          cp analysis/worldclass/research/cot-raw-position-oi-predictive-power-summary.json "$SNAP/cot-raw-position-oi-predictive-power-summary.json"
          gzip -9 -c analysis/worldclass/research/cot-raw-position-oi-predictive-power.json > "$SNAP/cot-raw-position-oi-predictive-power.json.gz"
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          snap=Path('analysis/worldclass/research/candidate-snapshots/2026-08-11-release-corrected-v2');files={}
          for p in sorted(snap.rglob('*')):
              if p.is_file(): files[str(p.relative_to(snap))]={'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()}
          calendar=Path('analysis/reference/cftc_release_calendar.json')
          manifest={'schema_version':3,'snapshot_id':'2026-08-11-release-corrected-v2','research_generation':'release-corrected-v2','information_contract_version':'cftc-public-availability-v2','release_calendar_sha256':hashlib.sha256(calendar.read_bytes()).hexdigest(),'supersedes_for_predictive_use':['2026-08-10','2026-08-10-predictive-power','2026-08-11-position-oi','2026-08-11-position-oi-all-actors'],'old_snapshots_modified':False,'files':files,'promotion_eligible':False,'production_weight_changes':False,'note':'Immutable historical research generation. Prospective live evidence remains separate.'}
          (snap/'verification-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          sums=[]
          for p in sorted(snap.rglob('*')):
              if p.is_file() and p.name not in {'SHA256SUMS.txt'}:sums.append(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(snap)}")
          (snap/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          PY
      - name: Freeze immutable snapshot on research branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/cot-release-correctness-v2'
        shell: bash
        run: |
          set -euo pipefail
          SRC=analysis/worldclass/research/candidate-snapshots/2026-08-11-release-corrected-v2
          DEST=analysis/worldclass/research/snapshots/2026-08-11-release-corrected-v2
          if [ -e "$DEST/verification-manifest.json" ]; then
            echo 'v2 snapshot already frozen; verifying immutable checksum set'
            (cd "$DEST" && sha256sum -c SHA256SUMS.txt)
            exit 0
          fi
          mkdir -p "$(dirname "$DEST")"
          cp -R "$SRC" "$DEST"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$DEST"
          git commit -m 'research: freeze release-corrected v2 snapshot [skip ci]'
          git push origin HEAD:fix/cot-release-correctness-v2
      - uses: actions/upload-artifact@v4
        with:
          name: cot-release-corrected-v2
          path: analysis/worldclass/research/candidate-snapshots/2026-08-11-release-corrected-v2
          if-no-files-found: error
