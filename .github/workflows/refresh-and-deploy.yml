# ─────────────────────────────────────────────────────────────────────────────
# COT Dashboard – Refresh data & deploy to GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push to main          – rebuild & deploy on every merge
#   • Manual dispatch       – one-click rebuild from the Actions tab
#   • Cron (Sat 08:00 UTC)  – COT data is released Friday; Saturday morning
#                             gives time for all upstream sources to update
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh and Deploy

on:
  workflow_dispatch:           # Manual "Run workflow" button
  schedule:
    - cron: "35 19 * * 5"      # Every Friday at 19:35 UTC (21:35 Stockholm CEST)

# ── Permissions required for deployment ────────────────────────────────────
permissions:
  contents: write

# ── Prevent overlapping deployments ──────────────────────────────────────────
concurrency:
  group: pages-deploy
  cancel-in-progress: false    # Let the running deploy finish; don't cancel it

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout with full history (needed for any git-log analysis) ──
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      # ── 3. Install dependencies ──────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt

      # ── 4. Run the refresh pipeline ──────────────────────────────────────
      #    --refresh-only : rebuild data + HTML, don't start the HTTP server
      #    --no-legacy    : skip legacy COT correlations (speeds up CI)
      #
      #    If the refresh fails (API downtime, rate limits, etc.), we still
      #    deploy whatever HTML already exists in the repo so the site stays up.
      - name: Refresh dashboard data
        id: refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python analysis/serve_interactive_cot_dashboard.py \
            --refresh-only

      - name: Warn if refresh failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::Dashboard refresh failed – deploying existing HTML."
          echo "Check the logs above for details (API rate limits, network, etc.)."

      # ── 5. Verify the dashboard HTML exists before deploying ─────────────
      - name: Verify dashboard output
        run: |
          if [ ! -f analysis/interactive_cot_dashboard.html ]; then
            echo "::error::No dashboard HTML found – nothing to deploy."
            exit 1
          fi
          echo "Dashboard size: $(du -h analysis/interactive_cot_dashboard.html | cut -f1)"

      # ── 6. Prepare index.html for GitHub Pages ───────────────────────────
      - name: Prepare index.html
        run: cp analysis/interactive_cot_dashboard.html analysis/index.html

      # ── 7. Deploy to gh-pages branch (Bypasses artifact storage limits) ──
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./analysis
          force_orphan: true    # Overwrites history with a single commit to prevent repo bloat

      # ── 8. Trigger GitHub Pages Rebuild ──────────────────────────────────
      # Pushes made with the default GITHUB_TOKEN do not trigger the internal
      # Pages build workflow for security reasons. We trigger it manually here.
      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST /repos/${{ github.repository }}/pages/builds
