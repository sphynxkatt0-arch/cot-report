# Validate, refresh and deploy COT Intelligence from the certified release-corrected v2 research generation.
name: Refresh and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
  schedule:
    - cron: '35 19 * * 5'
    - cron: '35 20 * * 5'

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            if [ "${{ github.event.pull_request.merged }}" = 'true' ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi
            exit 0
          fi
          if [ "${{ github.event_name }}" != 'schedule' ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0; fi
          utc_day="$(date -u +%F)"
          case '${{ github.event.schedule }}' in
            '35 19 * * 5') scheduled_utc="$utc_day 19:35:00 UTC" ;;
            '35 20 * * 5') scheduled_utc="$utc_day 20:35:00 UTC" ;;
            *) echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          eastern="$(TZ=America/New_York date -d "$scheduled_utc" +%H:%M)"
          if [ "$eastern" = '15:35' ]; then echo 'run=true' >> "$GITHUB_OUTPUT"; else echo 'run=false' >> "$GITHUB_OUTPUT"; fi

  refresh-and-deploy:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: analysis/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt
      - name: '[VALIDATING] v2 source and immutable-ledger syntax'
        run: |
          python -m py_compile \
            analysis/cftc_release_calendar.py analysis/cot_research_core.py analysis/fetch_release_corrected_snapshot_v2.py analysis/build_worldclass_bundle.py analysis/build_worldclass_backtest.py analysis/build_worldclass_regime_backtest.py \
            analysis/build_interactive_cot_dashboard_v2.py analysis/serve_interactive_cot_dashboard_v2.py analysis/build_worldclass_research_artifacts.py analysis/install_release_corrected_runtime_v2.py \
            analysis/validate_worldclass_release_v2.py analysis/test_cot_intelligence_dashboard_v2.py analysis/live/ledger_v2.py analysis/live/generate_live_forecasts_v2.py \
            analysis/live/apply_live_forecasts_v2.py analysis/live/append_ledger_manifest_v2.py analysis/live/settle_live_signals_v2.py analysis/live/build_live_track_record_v2.py \
            analysis/live/validate_live_ledger_v2.py analysis/test_live_ledger_v2.py analysis/macro_liquidity_expansion_v12.py analysis/test_macro_liquidity_parsers.py
          node --check analysis/worldclass/app.js
          node --check analysis/worldclass/bootstrap.js
          node --check analysis/worldclass/current-edge-model.js
          node --check analysis/worldclass/current-edge-command.js
          node --check analysis/worldclass/cot-intelligence.js
          node --check analysis/worldclass/cot-intelligence-v2-copy.js
      - name: '[VALIDATING] materialize exact certified v2 research snapshot'
        run: |
          python analysis/fetch_release_corrected_snapshot_v2.py
          SNAP=analysis/worldclass/research/snapshots/2026-08-11-release-corrected-v2
          test -s "$SNAP/verification-manifest.json"
          (cd "$SNAP" && sha256sum -c SHA256SUMS.txt)
          python analysis/test_live_ledger_v2.py
      - name: '[WAITING_FOR_CFTC] refresh raw normalized source layer'
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python analysis/serve_interactive_cot_dashboard_v2.py --refresh-only
      - name: Warn if source refresh failed
        if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && steps.refresh.outcome == 'failure'
        run: echo '::warning::Raw source refresh failed; deployment will retain last-valid normalized source where available.'
      - name: Build compact browser data bundle
        run: python analysis/build_worldclass_bundle.py
      - name: Restore last-valid deployed caches and full-history source
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p analysis/worldclass analysis/worldclass/research analysis/model_output
          git fetch origin gh-pages:refs/remotes/origin/gh-pages --depth=1 || true
          git show origin/gh-pages:worldclass/metals.json > /tmp/metals.json 2>/dev/null || true
          git show origin/gh-pages:worldclass/research/metals-full.json > /tmp/metals-full.json 2>/dev/null || true
          git show origin/gh-pages:model_output/macro_liquidity_expansion.json > /tmp/macro.json 2>/dev/null || true
          git show origin/gh-pages:worldclass/market-sentiment.json > /tmp/sentiment.json 2>/dev/null || true
          [ ! -s /tmp/metals.json ] || cp /tmp/metals.json analysis/worldclass/metals.json
          [ ! -s /tmp/metals-full.json ] || cp /tmp/metals-full.json analysis/worldclass/research/metals-full.json
          [ ! -s /tmp/macro.json ] || cp /tmp/macro.json analysis/model_output/macro_liquidity_expansion.json
          [ ! -s /tmp/sentiment.json ] || cp /tmp/sentiment.json analysis/worldclass/market-sentiment.json
      - name: '[CFTC_AVAILABLE] refresh Gold and Silver COT'
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        id: metals
        continue-on-error: true
        run: python analysis/build_worldclass_metals.py
      - name: '[BUILDING] refresh macro liquidity payload'
        id: plumbing
        continue-on-error: true
        run: python analysis/macro_liquidity_expansion_v12.py
      - name: '[BUILDING] current context + certified frozen v2 evidence runtime'
        run: |
          python analysis/build_worldclass_research_artifacts.py
          test ! -e analysis/worldclass/.research-base.tmp.json
      - name: '[VALIDATING] release/data/dashboard contracts'
        run: |
          python analysis/validate_worldclass_release_v2.py
          python analysis/test_cot_intelligence_dashboard_v2.py
      - name: '[FORWARD_TEST] stage canonical v2 live forecasts'
        id: live_forecasts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf analysis/.live-ledger-staging
          python analysis/live/generate_live_forecasts_v2.py --staging analysis/.live-ledger-staging
          count="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('analysis/.live-ledger-staging/plan.json').read_text());print(int(p.get('forecast_count') or 0))
          PY
          )"
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: '[FORWARD_TEST] append v2 forecasts to authoritative ledger'
        if: steps.live_forecasts.outputs.count != '0'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-live-ledger /tmp/cot-live-append.json
          git fetch origin live-ledger:refs/remotes/origin/live-ledger
          git worktree add --detach /tmp/cot-live-ledger origin/live-ledger
          python analysis/live/validate_live_ledger_v2.py --ledger-root /tmp/cot-live-ledger --verify-git-history
          python analysis/live/apply_live_forecasts_v2.py --staging analysis/.live-ledger-staging --ledger-root /tmp/cot-live-ledger --metadata-out /tmp/cot-live-append.json
          new_count="$(python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/cot-live-append.json').read_text());print(int(p.get('new_count') or 0))
          PY
          )"
          if [ "$new_count" -eq 0 ]; then exit 0; fi
          git -C /tmp/cot-live-ledger config user.name 'github-actions[bot]'
          git -C /tmp/cot-live-ledger config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/cot-live-ledger add live/forecasts
          git -C /tmp/cot-live-ledger commit -m 'Append prospective release-corrected COT forecasts'
          forecast_commit="$(git -C /tmp/cot-live-ledger rev-parse HEAD)"
          python analysis/live/append_ledger_manifest_v2.py --ledger-root /tmp/cot-live-ledger --metadata /tmp/cot-live-append.json --forecast-commit-sha "$forecast_commit"
          git -C /tmp/cot-live-ledger add live/manifests
          git -C /tmp/cot-live-ledger commit -m 'Append release-corrected forecast integrity manifests'
          python analysis/live/validate_live_ledger_v2.py --ledger-root /tmp/cot-live-ledger --verify-git-history
          git -C /tmp/cot-live-ledger push origin HEAD:live-ledger
      - name: '[FORWARD_TEST] build presentation track record'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-live-ledger-track
          git fetch origin live-ledger:refs/remotes/origin/live-ledger
          git worktree add --detach /tmp/cot-live-ledger-track origin/live-ledger
          python analysis/live/validate_live_ledger_v2.py --ledger-root /tmp/cot-live-ledger-track --verify-git-history
          python analysis/live/build_live_track_record_v2.py --ledger-root /tmp/cot-live-ledger-track --output analysis/worldclass/live-track-record.json
          test -s analysis/worldclass/live-track-record.json
      - name: '[VALIDATING] production outputs'
        run: |
          for p in analysis/worldclass/base.json analysis/worldclass/model-spec.json analysis/worldclass/metals.json analysis/worldclass/backtest.json analysis/worldclass/regime_backtest.json analysis/worldclass/cot-current-state.json analysis/worldclass/cot-edge-registry.json analysis/worldclass/cot-active-edges.json analysis/worldclass/cot-cross-market.json analysis/worldclass/cot-research-provenance.json analysis/worldclass/live-track-record.json analysis/worldclass/release-status.json analysis/model_output/macro_liquidity_expansion.json analysis/worldclass_dashboard.html; do test -s "$p"; done
          python - <<'PY'
          import json
          from pathlib import Path
          wc=Path('analysis/worldclass');prov=json.loads((wc/'cot-research-provenance.json').read_text());reg=json.loads((wc/'cot-edge-registry.json').read_text());active=json.loads((wc/'cot-active-edges.json').read_text());cross=json.loads((wc/'cot-cross-market.json').read_text())
          assert prov['research_generation']=='release-corrected-v2' and prov['historical_research_frozen'] is True
          assert reg['research_generation']=='release-corrected-v2' and len(reg['actors'])==59 and reg['research_counts']['actor_horizon_cells']==885 and reg['research_counts']['market_oi_horizon_cells']==105 and reg['automatic_promotion_allowed'] is False
          assert active['research_generation']=='release-corrected-v2' and active['schema_version']==5 and active['automatic_promotion_allowed'] is False and (wc/'cot-active-edges.json').stat().st_size<=180000
          assert cross['research_generation']=='release-corrected-v2' and cross['governance']['status']=='DISCOVERY_ONLY'
          print('Production v2 runtime PASS')
          PY
      - name: '[BUILDING] prepare production index'
        run: cp analysis/worldclass_dashboard.html analysis/index.html
      - name: '[DEPLOYING] publish validated site to gh-pages'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./analysis
          force_orphan: true
      - name: '[LIVE] verify published gh-pages v2 contract'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages:refs/remotes/origin/gh-pages --force
          git show origin/gh-pages:worldclass/cot-research-provenance.json > /tmp/prov.json
          git show origin/gh-pages:worldclass/cot-edge-registry.json > /tmp/reg.json
          git show origin/gh-pages:worldclass/cot-active-edges.json > /tmp/active.json
          python - <<'PY'
          import json,os
          p=json.load(open('/tmp/prov.json'));r=json.load(open('/tmp/reg.json'));a=json.load(open('/tmp/active.json'))
          assert p['research_generation']=='release-corrected-v2' and p['historical_research_frozen'] is True
          assert r['research_generation']=='release-corrected-v2' and r['automatic_promotion_allowed'] is False and r['research_counts']['actor_horizon_cells']==885 and r['research_counts']['market_oi_horizon_cells']==105
          assert a['research_generation']=='release-corrected-v2' and a['schema_version']==5 and a['automatic_promotion_allowed'] is False and os.path.getsize('/tmp/active.json')<=180000
          print('Published gh-pages release-corrected v2 contract PASS')
          PY
