# ─────────────────────────────────────────────────────────────────────────────
# COT Intelligence – refresh data & deploy to GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push to main          – fast deploy using the already-validated research bundle
#   • Manual dispatch       – full data refresh + deploy
#   • Friday 19:35 UTC      – full refresh at 21:35 Stockholm during CEST
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "35 19 * * 5"

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt

      - name: Validate v2 source syntax
        run: |
          python -m py_compile analysis/build_worldclass_metals.py analysis/build_worldclass_bundle.py
          node --check analysis/worldclass/app.js
          node --check analysis/worldclass/bootstrap.js

      # A normal code push should deploy quickly instead of re-running every
      # macro/backtest job. Scheduled/manual runs still execute the complete
      # research refresh and become the source for the next lightweight push.
      - name: Refresh index COT and macro data
        if: github.event_name != 'push'
        id: refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python analysis/serve_interactive_cot_dashboard.py \
            --refresh-only

      - name: Warn if core refresh failed
        if: github.event_name != 'push' && steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::Core COT/macro refresh failed – deploying the last generated base dashboard."
          echo "Check the logs above for CFTC/FRED/API availability."

      - name: Build compact browser data bundle
        run: python analysis/build_worldclass_bundle.py

      # Restore the last deployed metals file before refreshing. If CFTC or
      # Yahoo is temporarily unavailable, build_worldclass_metals.py keeps the
      # restored good cache instead of making Silver disappear from the UI.
      - name: Restore deployed Gold and Silver cache
        continue-on-error: true
        run: |
          mkdir -p analysis/worldclass
          git fetch origin gh-pages --depth=1
          git show FETCH_HEAD:worldclass/metals.json > analysis/worldclass/metals.json

      - name: Refresh Gold and Silver disaggregated COT
        id: metals
        continue-on-error: true
        run: python analysis/build_worldclass_metals.py

      - name: Warn if metals refresh failed
        if: steps.metals.outcome == 'failure'
        run: |
          echo "::warning::Gold/Silver Disaggregated refresh failed. A prior deployed cache will be used when available."

      - name: Verify dashboard outputs
        run: |
          if [ ! -f analysis/interactive_cot_dashboard.html ]; then
            echo "::error::No base dashboard HTML found – v2 has no research source to build from."
            exit 1
          fi
          if [ ! -s analysis/worldclass/base.json ]; then
            echo "::error::Compact worldclass/base.json was not generated."
            exit 1
          fi
          if [ ! -f analysis/worldclass_dashboard.html ]; then
            echo "::error::No world-class dashboard shell found."
            exit 1
          fi
          if [ ! -f analysis/worldclass/app.js ] || [ ! -f analysis/worldclass/bootstrap.js ] || [ ! -f analysis/worldclass/styles.css ]; then
            echo "::error::World-class dashboard assets are incomplete."
            exit 1
          fi
          echo "Research HTML: $(du -h analysis/interactive_cot_dashboard.html | cut -f1)"
          echo "Browser bundle: $(du -h analysis/worldclass/base.json | cut -f1)"
          if [ -f analysis/worldclass/metals.json ]; then
            echo "Gold/Silver dataset: $(du -h analysis/worldclass/metals.json | cut -f1)"
          else
            echo "::warning::No metals.json is available for this deployment."
          fi

      # Root GitHub Pages opens the v2 interface. The original generated
      # dashboard remains published as a calculation artifact and fallback.
      - name: Prepare world-class index.html
        run: cp analysis/worldclass_dashboard.html analysis/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./analysis
          force_orphan: true

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST /repos/${{ github.repository }}/pages/builds
