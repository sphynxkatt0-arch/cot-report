# COT Intelligence – validate, refresh and deploy to GitHub Pages.
# Scheduled twice in UTC and gated to the UTC cron that maps to exactly 21:35
# Europe/Stockholm. The gate uses the scheduled time, not runner start time, so
# normal GitHub Actions queue delays cannot suppress the Friday refresh.
name: Refresh and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "35 19 * * 5"
    - cron: "35 20 * * 5"
    # One-time backend recovery trigger. The gate below allows this expression
    # only on 2026-08-08 UTC, so it self-expires after tonight.
    - cron: "20 22 8 8 *"

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  schedule-gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          schedule_expr='${{ github.event.schedule }}'
          utc_day="$(date -u +%F)"
          if [ "$schedule_expr" = "20 22 8 8 *" ]; then
            if [ "$utc_day" = "2026-08-08" ]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "Running one-time backend recovery deployment."
            else
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "One-time backend recovery schedule is expired."
            fi
            exit 0
          fi

          case "$schedule_expr" in
            "35 19 * * 5") scheduled_utc="$utc_day 19:35:00 UTC" ;;
            "35 20 * * 5") scheduled_utc="$utc_day 20:35:00 UTC" ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "Unknown scheduled trigger: $schedule_expr"
              exit 0
              ;;
          esac

          scheduled_local="$(TZ=Europe/Stockholm date -d "$scheduled_utc" +%H:%M)"
          if [ "$scheduled_local" = "21:35" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled trigger maps to 21:35 Stockholm; running even if the runner started late."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC cron; scheduled Stockholm time is $scheduled_local."
          fi

  refresh-and-deploy:
    needs: schedule-gate
    if: needs.schedule-gate.outputs.run == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt

      - name: "[VALIDATING] Source syntax"
        run: |
          python -m py_compile \
            analysis/build_worldclass_metals.py \
            analysis/build_worldclass_bundle.py \
            analysis/build_worldclass_backtest.py \
            analysis/build_worldclass_regime_backtest.py \
            analysis/validate_worldclass_release.py \
            analysis/macro_liquidity_expansion.py \
            analysis/macro_liquidity_expansion_v12.py \
            analysis/treasury_cash_flow_extension.py \
            analysis/treasury_auction_absorption.py \
            analysis/test_macro_liquidity_parsers.py
          node --check analysis/worldclass/app.js
          node --check analysis/worldclass/bootstrap.js
          node --check analysis/worldclass/enhancements.js
          node --check analysis/worldclass/decision-system.js
          node --check analysis/worldclass/macro-control-fallback.js
          node --check analysis/worldclass/macro-state-renderer.js
          node --check analysis/worldclass/macro-live-sources.js

      - name: "[VALIDATING] Macro source parser regression tests"
        run: python analysis/test_macro_liquidity_parsers.py

      - name: "[WAITING_FOR_CFTC] Refresh index COT and macro source dashboard"
        if: github.event_name != 'push'
        id: refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python analysis/serve_interactive_cot_dashboard.py --refresh-only

      - name: Warn if core refresh failed
        if: github.event_name != 'push' && steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::Core COT/macro refresh failed. Deployment will retain the last valid payload and expose stale/delayed state."

      - name: Build compact browser data bundle
        run: python analysis/build_worldclass_bundle.py

      - name: Restore last-valid deployed caches
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p analysis/worldclass analysis/model_output
          git fetch origin gh-pages --depth=1
          git show FETCH_HEAD:worldclass/metals.json > /tmp/metals.json 2>/dev/null || true
          git show FETCH_HEAD:model_output/macro_liquidity_expansion.json > /tmp/macro_liquidity_expansion.json 2>/dev/null || true
          if [ -s /tmp/metals.json ]; then cp /tmp/metals.json analysis/worldclass/metals.json; fi
          if [ -s /tmp/macro_liquidity_expansion.json ]; then
            cp /tmp/macro_liquidity_expansion.json analysis/model_output/macro_liquidity_expansion.json
          fi

      - name: "[CFTC_AVAILABLE] Refresh Gold and Silver Disaggregated COT"
        if: github.event_name != 'push'
        id: metals
        continue-on-error: true
        run: python analysis/build_worldclass_metals.py

      - name: Warn if metals refresh failed
        if: github.event_name != 'push' && steps.metals.outcome == 'failure'
        run: echo "::warning::Gold/Silver refresh failed; retaining last-valid deployed metals cache when available."

      - name: "[BUILDING] Refresh macro liquidity control-room payload"
        id: plumbing
        continue-on-error: true
        run: python analysis/macro_liquidity_expansion_v12.py

      - name: Warn if plumbing refresh failed
        if: steps.plumbing.outcome == 'failure'
        run: echo "::warning::Macro plumbing builder process failed; validation will use the restored last-valid payload when present. A missing payload remains a hard contract failure."

      - name: Build walk-forward COT backtests
        run: python analysis/build_worldclass_backtest.py

      - name: Build regime-conditioned COT + macro backtests
        run: python analysis/build_worldclass_regime_backtest.py

      - name: "[VALIDATING] Data contracts, lookahead safety and performance budget"
        run: python analysis/validate_worldclass_release.py

      - name: Verify production outputs
        shell: bash
        run: |
          test -s analysis/interactive_cot_dashboard.html
          test -s analysis/worldclass/base.json
          test -s analysis/worldclass/backtest.json
          test -s analysis/worldclass/regime_backtest.json
          test -s analysis/worldclass/release-status.json
          test -s analysis/model_output/macro_liquidity_expansion.json
          test -s analysis/worldclass_dashboard.html
          test -s analysis/worldclass/app.js
          test -s analysis/worldclass/bootstrap.js
          test -s analysis/worldclass/decision-system.js
          test -s analysis/worldclass/decision-system.css
          test -s analysis/worldclass/macro-control-fallback.js
          test -s analysis/worldclass/macro-state-renderer.js
          test -s analysis/worldclass/macro-live-sources.js
          echo "Research HTML: $(du -h analysis/interactive_cot_dashboard.html | cut -f1)"
          echo "Browser bundle: $(du -h analysis/worldclass/base.json | cut -f1)"
          echo "COT backtest: $(du -h analysis/worldclass/backtest.json | cut -f1)"
          echo "Regime backtest: $(du -h analysis/worldclass/regime_backtest.json | cut -f1)"
          echo "Macro plumbing: $(du -h analysis/model_output/macro_liquidity_expansion.json | cut -f1)"
          cat analysis/worldclass/release-status.json

      - name: "[BUILDING] Prepare production index"
        run: cp analysis/worldclass_dashboard.html analysis/index.html

      - name: "[DEPLOYING] Publish to gh-pages"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./analysis
          force_orphan: true

      - name: "[LIVE] Verify published gh-pages contract"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            model_output/macro_liquidity_expansion.json \
            worldclass/decision-system.js \
            worldclass/decision-system.css \
            worldclass/macro-control-fallback.js \
            worldclass/macro-state-renderer.js \
            worldclass/macro-live-sources.js \
            worldclass/bootstrap.js \
            index.html
          do
            size="$(gh api "/repos/${{ github.repository }}/contents/${path}?ref=gh-pages" --jq '.size')"
            test "${size}" -gt 0
            echo "Published ${path}: ${size} bytes"
          done

      - name: "[LIVE] Trigger Pages rebuild"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST /repos/${{ github.repository }}/pages/builds
