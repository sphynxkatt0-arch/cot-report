# ─────────────────────────────────────────────────────────────────────────────
# COT Intelligence – refresh data & deploy to GitHub Pages
# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Push to main          – deploy immediately after a merged improvement
#   • Manual dispatch       – one-click rebuild from the Actions tab
#   • Friday 19:35 UTC      – 21:35 Stockholm during CEST, just after COT release
# ─────────────────────────────────────────────────────────────────────────────

name: Refresh and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "35 19 * * 5"

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r analysis/requirements.txt

      - name: Validate v2 source syntax
        run: |
          python -m py_compile analysis/build_worldclass_metals.py
          node --check analysis/worldclass/app.js

      # The existing research pipeline remains the source of truth for TFF,
      # Legacy, price/factor histories and the unified macro-liquidity model.
      - name: Refresh index COT and macro data
        id: refresh
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python analysis/serve_interactive_cot_dashboard.py \
            --refresh-only

      - name: Warn if core refresh failed
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "::warning::Core COT/macro refresh failed – attempting deployment with the last generated base dashboard."
          echo "Check the logs above for CFTC/FRED/API availability."

      # Gold and Silver are physical commodities and belong in the CFTC
      # Disaggregated report, not TFF. This creates the dedicated v2 dataset.
      - name: Refresh Gold and Silver disaggregated COT
        id: metals
        continue-on-error: true
        run: python analysis/build_worldclass_metals.py

      - name: Warn if metals refresh failed
        if: steps.metals.outcome == 'failure'
        run: |
          echo "::warning::Gold/Silver Disaggregated refresh failed. The dashboard will expose any available cached/legacy data and mark unavailable instruments accordingly."

      - name: Verify dashboard outputs
        run: |
          if [ ! -f analysis/interactive_cot_dashboard.html ]; then
            echo "::error::No base dashboard HTML found – v2 has no embedded research data to load."
            exit 1
          fi
          if [ ! -f analysis/worldclass_dashboard.html ]; then
            echo "::error::No world-class dashboard shell found."
            exit 1
          fi
          if [ ! -f analysis/worldclass/app.js ] || [ ! -f analysis/worldclass/styles.css ]; then
            echo "::error::World-class dashboard assets are incomplete."
            exit 1
          fi
          echo "Base dashboard: $(du -h analysis/interactive_cot_dashboard.html | cut -f1)"
          if [ -f analysis/worldclass/metals.json ]; then
            echo "Gold/Silver dataset: $(du -h analysis/worldclass/metals.json | cut -f1)"
          else
            echo "::warning::No metals.json was generated in this run."
          fi

      # Root GitHub Pages now opens the v2 interface. The old generated
      # interactive_cot_dashboard.html is still published as a data source and
      # a rollback/fallback page.
      - name: Prepare world-class index.html
        run: cp analysis/worldclass_dashboard.html analysis/index.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./analysis
          force_orphan: true

      - name: Trigger Pages rebuild
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST /repos/${{ github.repository }}/pages/builds
