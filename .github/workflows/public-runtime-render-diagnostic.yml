name: Public runtime render diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/public-runtime-render-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Render live dashboard in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "::error::No Chrome/Chromium found on runner"
            exit 1
          fi
          echo "CHROME=${chrome}"
          url="https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/?runtime_diag=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          set +e
          timeout 70 "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --enable-logging=stderr \
            --log-level=0 \
            --virtual-time-budget=30000 \
            --dump-dom "$url" > /tmp/dom.html 2> /tmp/chrome.log
          status=$?
          set -e
          echo "CHROME_EXIT=${status}"
          echo "DOM_BYTES=$(wc -c < /tmp/dom.html)"
          echo "LOADING_DONE_COUNT=$(grep -c 'id=\"loadingOverlay\" class=\"loading-overlay done\"' /tmp/dom.html || true)"
          echo "LOAD_FAILURE_COUNT=$(grep -c 'Dashboard data failed to load' /tmp/dom.html || true)"
          echo "HEADLINE_CARD_COUNT=$(grep -o 'class=\"headline-card' /tmp/dom.html | wc -l)"
          echo "WEEKLY_ROW_COUNT=$(grep -o '<tr>' /tmp/dom.html | wc -l)"
          echo "POSITION_ROW_COUNT=$(grep -o 'class=\"position-row' /tmp/dom.html | wc -l)"
          echo "MACRO_CARD_COUNT=$(grep -o 'class=\"macro-card' /tmp/dom.html | wc -l)"
          echo "NA_COUNT=$(grep -o '>n/a<' /tmp/dom.html | wc -l)"
          echo "FRESHNESS=$(grep -o 'id=\"freshnessPill\"[^>]*>.*</div>' /tmp/dom.html | head -1 | sed -E 's/<[^>]+>/ /g' | tr -s ' ' || true)"
          echo '--- CHROME ERRORS/WARNINGS ---'
          grep -Ei 'error|failed|exception|uncaught|warning|ERR_' /tmp/chrome.log | tail -100 || true
          echo '--- IMPORTANT DOM FRAGMENTS ---'
          grep -Eo 'Dashboard data failed to load|Building market view|COT score|Latest report|Net / open interest|Unified liquidity|Net liquidity 4W|Bank reserves|SOFR − IORB' /tmp/dom.html | sort | uniq -c || true
          test "$status" -eq 0
          test "$(grep -c 'Dashboard data failed to load' /tmp/dom.html || true)" -eq 0
          test "$(grep -o 'class=\"headline-card' /tmp/dom.html | wc -l)" -ge 3
          test "$(grep -o 'class=\"position-row' /tmp/dom.html | wc -l)" -ge 2
          test "$(grep -o 'class=\"macro-card' /tmp/dom.html | wc -l)" -ge 6
