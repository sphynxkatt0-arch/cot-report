name: Ensure COT Refresh Retry

on:
  workflow_dispatch:
  schedule:
    # Retry the canonical refresh at 22:35 Stockholm, one hour after the weekday 21:35 run,
    # Monday to Friday. 20:35 UTC is 22:35 during CEST; 21:35 UTC is 22:35 during CET.
    - cron: '35 20 * * 1-5'
    - cron: '35 21 * * 1-5'

permissions:
  contents: read
  actions: write

concurrency:
  group: cot-refresh-dispatch
  cancel-in-progress: true

jobs:
  dispatch-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether refresh dispatch is due
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          utc_day="$(date -u +%F)"
          case '${{ github.event.schedule }}' in
            '35 20 * * 1-5') scheduled_utc="$utc_day 20:35:00 UTC" ;;
            '35 21 * * 1-5') scheduled_utc="$utc_day 21:35:00 UTC" ;;
            *) echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          stockholm="$(TZ=Europe/Stockholm date -d "$scheduled_utc" +%H:%M)"
          if [ "$stockholm" = '22:35' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch canonical refresh workflow
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run refresh-and-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
