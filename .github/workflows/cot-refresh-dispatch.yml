name: Ensure COT Refresh Dispatch

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Retry the canonical Friday refresh one hour after the expected 15:35 ET run.
    # 20:35 UTC is 16:35 ET during EDT; 21:35 UTC is 16:35 ET during EST.
    - cron: '35 20 * * 5'
    - cron: '35 21 * * 5'

permissions:
  contents: read
  actions: write

concurrency:
  group: cot-refresh-dispatch
  cancel-in-progress: true

jobs:
  dispatch-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether refresh dispatch is due
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          utc_day="$(date -u +%F)"
          case '${{ github.event.schedule }}' in
            '35 20 * * 5') scheduled_utc="$utc_day 20:35:00 UTC" ;;
            '35 21 * * 5') scheduled_utc="$utc_day 21:35:00 UTC" ;;
            *) echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          eastern="$(TZ=America/New_York date -d "$scheduled_utc" +%H:%M)"
          if [ "$eastern" = '16:35' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch canonical refresh workflow
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run refresh-and-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
