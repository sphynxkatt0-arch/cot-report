name: Ensure COT Refresh Retry

on:
  workflow_dispatch:
  schedule:
    # Retry the canonical refresh one hour after the expected 21:35 Stockholm / 15:35 ET run every day.
    # 20:35 UTC is 16:35 ET / 22:35 Stockholm during EDT; 21:35 UTC is 16:35 ET / 22:35 Stockholm during EST.
    - cron: '35 20 * * *'
    - cron: '35 21 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: cot-refresh-dispatch
  cancel-in-progress: true

jobs:
  dispatch-refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether refresh dispatch is due
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" != 'schedule' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          utc_day="$(date -u +%F)"
          case '${{ github.event.schedule }}' in
            '35 20 * * *') scheduled_utc="$utc_day 20:35:00 UTC" ;;
            '35 21 * * *') scheduled_utc="$utc_day 21:35:00 UTC" ;;
            *) echo 'run=false' >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac

          eastern="$(TZ=America/New_York date -d "$scheduled_utc" +%H:%M)"
          stockholm="$(TZ=Europe/Stockholm date -d "$scheduled_utc" +%H:%M)"
          if [ "$stockholm" = '22:35' ] || [ "$eastern" = '16:35' ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch canonical refresh workflow
        if: steps.gate.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run refresh-and-deploy.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
