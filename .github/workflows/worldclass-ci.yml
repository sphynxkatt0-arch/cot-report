name: World-class dashboard CI

on:
  pull_request:
    paths:
      - 'analysis/worldclass/**'
      - 'analysis/live/**'
      - 'analysis/build_worldclass_*.py'
      - 'analysis/build_cot_*.py'
      - 'analysis/install_release_corrected_runtime_v2.py'
      - 'analysis/test_live_ledger_v2.py'
      - 'analysis/validate_worldclass_release.py'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-v2-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install dependencies
        run: pip install -r analysis/requirements.txt
      - name: Source syntax and browser JavaScript
        run: |
          python -m py_compile \
            analysis/build_worldclass_bundle.py analysis/build_worldclass_backtest.py analysis/build_worldclass_regime_backtest.py \
            analysis/build_worldclass_research_artifacts.py analysis/install_release_corrected_runtime_v2.py analysis/validate_worldclass_release.py \
            analysis/live/ledger_v2.py analysis/live/generate_live_forecasts_v2.py analysis/live/apply_live_forecasts_v2.py \
            analysis/live/append_ledger_manifest_v2.py analysis/live/settle_live_signals_v2.py analysis/live/validate_live_ledger_v2.py analysis/test_live_ledger_v2.py
          node --check analysis/worldclass/app.js
          node --check analysis/worldclass/bootstrap.js
          node --check analysis/worldclass/enhancements.js
          node --check analysis/worldclass/cot-intelligence.js
          node --check analysis/worldclass/current-edge-model.js
      - name: Mixed legacy/v2 live ledger regression
        run: python analysis/test_live_ledger_v2.py
      - name: Validate canonical model specification
        working-directory: analysis
        run: |
          python - <<'PY'
          import model_spec
          spec=model_spec.load_model_spec();digest=model_spec.model_spec_hash(spec)
          assert len(digest)==64 and spec['model_version']
          assert set(spec['score_models'])=={'tff','legacy','disaggregated'}
          assert set(spec['horizons'])=={'1w','2w','4w','13w','26w'}
          print('Model contract PASS',spec['model_version'],digest)
          PY
      - name: Verify frozen v2 snapshot if present
        shell: bash
        run: |
          SNAP=analysis/worldclass/research/snapshots/2026-08-11-release-corrected-v2
          if [ ! -f "$SNAP/verification-manifest.json" ]; then
            echo 'Frozen v2 snapshot pending full research workflow; runtime install is gated there.'
            exit 0
          fi
          (cd "$SNAP" && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('analysis/worldclass/research/snapshots/2026-08-11-release-corrected-v2/verification-manifest.json').read_text())
          assert p['research_generation']=='release-corrected-v2'
          assert p['promotion_eligible'] is False
          assert p['production_weight_changes'] is False
          PY
      - name: Build production runtime when frozen v2 exists
        shell: bash
        run: |
          SNAP=analysis/worldclass/research/snapshots/2026-08-11-release-corrected-v2
          if [ ! -f "$SNAP/verification-manifest.json" ]; then exit 0; fi
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          python analysis/build_worldclass_bundle.py
          python analysis/build_worldclass_research_artifacts.py
          python analysis/validate_worldclass_release.py
          test ! -e analysis/worldclass/.research-base.tmp.json
          python - <<'PY'
          import json
          from pathlib import Path
          wc=Path('analysis/worldclass')
          prov=json.loads((wc/'cot-research-provenance.json').read_text())
          assert prov['research_generation']=='release-corrected-v2'
          assert prov['historical_research_frozen'] is True
          reg=json.loads((wc/'cot-edge-registry.json').read_text());active=json.loads((wc/'cot-active-edges.json').read_text());cross=json.loads((wc/'cot-cross-market.json').read_text())
          assert reg['research_generation']==active['research_generation']==cross['research_generation']=='release-corrected-v2'
          back=json.loads((wc/'backtest.json').read_text());regime=json.loads((wc/'regime_backtest.json').read_text())
          for market,dataset in [('nq','tff'),('nq','legacy'),('sp500','tff'),('sp500','legacy'),('gold','disaggregated'),('silver','disaggregated')]:
              block=back['markets'][market]['datasets'][dataset]
              assert block['historical_signal_count']>=300,(market,dataset,block['historical_signal_count'])
              assert block['methodology']['lookahead_safe'] is True
              assert block['horizons']['4w']['observations']>=20
              r=regime['markets'][market]['datasets'][dataset]
              assert r['methodology']['lookahead_safe_cot'] is True
              assert r['methodology']['macro_vintage_safe'] is False
          print('Frozen v2 worldclass runtime PASS')
          PY
