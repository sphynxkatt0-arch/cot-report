name: World-class dashboard CI

on:
  pull_request:
    paths:
      - "analysis/worldclass/**"
      - "analysis/live/**"
      - "analysis/test_live_ledger.py"
      - "analysis/worldclass_dashboard.html"
      - "analysis/interactive_cot_dashboard.html"
      - "analysis/build_worldclass_metals.py"
      - "analysis/build_worldclass_bundle.py"
      - "analysis/build_worldclass_backtest.py"
      - "analysis/build_worldclass_regime_backtest.py"
      - "analysis/build_worldclass_research_artifacts.py"
      - "analysis/model_spec.py"
      - "analysis/validate_worldclass_release.py"
      - "analysis/config/model_spec.json"
      - "analysis/config/regime_rules.json"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Source syntax
        run: |
          python -m py_compile \
            analysis/model_spec.py \
            analysis/build_worldclass_metals.py \
            analysis/build_worldclass_bundle.py \
            analysis/build_worldclass_backtest.py \
            analysis/build_worldclass_regime_backtest.py \
            analysis/build_worldclass_research_artifacts.py \
            analysis/validate_worldclass_release.py \
            analysis/live/ledger.py \
            analysis/live/generate_live_forecasts.py \
            analysis/live/apply_live_forecasts.py \
            analysis/live/append_ledger_manifest.py \
            analysis/live/settle_live_signals.py \
            analysis/live/build_live_track_record.py \
            analysis/live/validate_live_ledger.py \
            analysis/test_live_ledger.py
          node --check analysis/worldclass/app.js
          node --check analysis/worldclass/bootstrap.js
          node --check analysis/worldclass/enhancements.js

      - name: Live ledger and settlement unit tests
        run: python analysis/test_live_ledger.py

      - name: Validate canonical model specification
        run: |
          cd analysis
          python - <<'PY'
          import model_spec
          spec = model_spec.load_model_spec()
          digest = model_spec.model_spec_hash(spec)
          assert len(digest) == 64
          assert spec['model_version']
          assert set(spec['score_models']) == {'tff', 'legacy', 'disaggregated'}
          assert set(spec['horizons']) == {'1w', '2w', '4w', '13w', '26w'}
          print(f"Model {spec['model_version']} · sha256={digest}")
          PY

      - name: Build and validate compact browser bundle
        run: |
          python analysis/build_worldclass_bundle.py
          test -s analysis/worldclass/base.json
          test -s analysis/worldclass/model-spec.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('analysis/worldclass/base.json').read_text())
          runtime_model = json.loads(Path('analysis/worldclass/model-spec.json').read_text())
          assert p.get('COT_DATA'), 'COT_DATA missing'
          assert p.get('PRICE_DATA'), 'PRICE_DATA missing'
          assert p.get('MODEL_SPEC'), 'MODEL_SPEC missing from runtime contract'
          assert p['MODEL_SPEC'] == runtime_model, 'embedded/standalone model contract mismatch'
          assert p['MODEL_SPEC']['model_spec_hash'] == p['bundle_meta']['model_spec_hash']
          assert p['MODEL_SPEC']['model_version'] == p['bundle_meta']['model_version']
          assert Path('analysis/worldclass/base.json').stat().st_size < Path('analysis/interactive_cot_dashboard.html').stat().st_size
          for dataset in p['COT_DATA'].values():
              if not isinstance(dataset, dict):
                  continue
              for payload in dataset.values():
                  if isinstance(payload, dict):
                      assert len(payload.get('records') or []) <= 312
          print('Compact runtime contract validation passed')
          PY

      - name: Build Gold and Silver dataset
        run: |
          python analysis/build_worldclass_metals.py
          test -s analysis/worldclass/metals.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('analysis/worldclass/metals.json').read_text())
          assert set(p['markets']) == {'gold', 'silver'}
          expected = {'producer_merchant', 'swap_dealer', 'managed_money', 'other_reportable', 'non_reportable'}
          for market in ('gold', 'silver'):
              payload = p['markets'][market]
              rows = payload['records']
              assert len(rows) >= 100, (market, len(rows))
              assert rows[-1]['date'] >= rows[-2]['date']
              assert expected == set(payload['categories']), (market, payload['categories'])
              assert 'managed_money_net' in rows[-1]
              assert 'other_reportable_net' in rows[-1]
              assert 'non_reportable_net' in rows[-1]
          print('Gold/Silver dataset validation passed')
          PY

      - name: Build full-history COT and regime research
        run: |
          python analysis/build_worldclass_research_artifacts.py
          test -s analysis/worldclass/backtest.json
          test -s analysis/worldclass/regime_backtest.json
          test ! -e analysis/worldclass/.research-base.tmp.json

      - name: Validate full-history research regressions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          base = json.loads(Path('analysis/worldclass/base.json').read_text())
          runtime_model = json.loads(Path('analysis/worldclass/model-spec.json').read_text())
          backtest = json.loads(Path('analysis/worldclass/backtest.json').read_text())
          regime = json.loads(Path('analysis/worldclass/regime_backtest.json').read_text())
          model_hash = runtime_model['model_spec_hash']
          model_version = runtime_model['model_version']

          assert base['MODEL_SPEC'] == runtime_model
          assert backtest['model_spec_hash'] == model_hash
          assert regime['model_spec_hash'] == model_hash
          assert backtest['model_version'] == model_version
          assert regime['model_version'] == model_version

          floors = {
              ('nq', 'tff'): 500,
              ('nq', 'legacy'): 500,
              ('sp500', 'tff'): 450,
              ('sp500', 'legacy'): 450,
              ('gold', 'disaggregated'): 500,
              ('silver', 'disaggregated'): 500,
          }
          for (market, dataset), floor in floors.items():
              payload = backtest['markets'][market]['datasets'][dataset]
              count = payload['historical_signal_count']
              assert count >= floor, (market, dataset, count, floor)
              assert payload['methodology']['lookahead_safe'] is True
              assert payload['model_spec_hash'] == model_hash
              assert payload['horizons'].get('4w'), (market, dataset)
              assert payload['horizons']['4w']['observations'] >= 20, (market, dataset)

              regime_payload = regime['markets'][market]['datasets'][dataset]
              assert regime_payload['methodology']['lookahead_safe'] is True
              assert regime_payload['model_spec_hash'] == model_hash
              assert set(regime_payload['families']) == {'cot', 'macro', 'combined'}

          required = {'sp500', 'nq', 'vix', 'rty', 'dow', 'gold', 'silver'}
          assert required.issubset(backtest['markets']), required - set(backtest['markets'])
          assert required.issubset(regime['markets']), required - set(regime['markets'])
          print('Full-history research regression validation passed')
          PY

      - name: Simulate prospective Friday ledger and live analytics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/cot-live-stage /tmp/cot-live-ledger /tmp/cot-live-append.json /tmp/cot-live-append-rerun.json /tmp/live-track-record.json
          simulated_now="$(python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          payload = json.loads(Path('analysis/worldclass/regime_backtest.json').read_text())
          dates = []
          for market in payload['markets'].values():
              for dataset in market.get('datasets', {}).values():
                  value = (dataset.get('current') or {}).get('release_target_date')
                  if value:
                      dates.append(value)
          latest = max(dates)
          day = datetime.fromisoformat(latest).date()
          stamp = datetime(day.year, day.month, day.day, 21, 35, tzinfo=ZoneInfo('Europe/Stockholm')).astimezone(UTC)
          print(stamp.isoformat(timespec='seconds').replace('+00:00', 'Z'))
          PY
          )"
          echo "Simulated prospective vintage: ${simulated_now}"
          python analysis/live/generate_live_forecasts.py \
            --output-root /tmp/cot-live-stage \
            --now-utc "${simulated_now}"
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/cot-live-stage/plan.json').read_text())
          assert plan['prospective_window_enforced'] is True
          assert plan['forecast_count'] > 0, plan
          print(f"Generated {plan['forecast_count']} deterministic live forecasts")
          PY
          mkdir -p /tmp/cot-live-ledger
          python analysis/live/apply_live_forecasts.py \
            --staging /tmp/cot-live-stage \
            --ledger-root /tmp/cot-live-ledger \
            --metadata-out /tmp/cot-live-append.json
          python analysis/live/append_ledger_manifest.py \
            --ledger-root /tmp/cot-live-ledger \
            --metadata /tmp/cot-live-append.json \
            --forecast-commit-sha ffffffffffffffffffffffffffffffffffffffff
          python analysis/live/validate_live_ledger.py --ledger-root /tmp/cot-live-ledger
          python analysis/live/build_live_track_record.py \
            --ledger-root /tmp/cot-live-ledger \
            --output /tmp/live-track-record.json \
            --now-utc "${simulated_now}"
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path('/tmp/cot-live-stage/plan.json').read_text())
          track = json.loads(Path('/tmp/live-track-record.json').read_text())
          assert track['forecast_count'] == plan['forecast_count']
          assert track['outcome_count'] == 0
          assert track['weekly_vintage_count'] >= 1
          assert track['ledger']['integrity'] == 'PASS'
          print('Live analytics contract validates immutable forecast-only vintage')
          PY
          python analysis/live/apply_live_forecasts.py \
            --staging /tmp/cot-live-stage \
            --ledger-root /tmp/cot-live-ledger \
            --metadata-out /tmp/cot-live-append-rerun.json
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('/tmp/cot-live-append-rerun.json').read_text())
          assert result['new_count'] == 0, result
          assert result['unchanged_count'] > 0, result
          print('Prospective ledger rerun is idempotent')
          PY
