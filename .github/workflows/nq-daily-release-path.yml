name: Exact weekday COT walk-forward diagnostic

on:
  push:
    branches:
      - analysis/nq-daily-release-path-20260810
  pull_request:
    branches:
      - main
    paths:
      - "analysis/diagnose_nq_daily_release_path.py"
      - "analysis/backtest_nq_cumulative_weekday_history.py"
      - "analysis/backtest_nq_actor_change_thresholds.py"
      - ".github/workflows/nq-daily-release-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: |
          python -m py_compile analysis/diagnose_nq_daily_release_path.py
          python -m py_compile analysis/backtest_nq_cumulative_weekday_history.py
          python -m py_compile analysis/backtest_nq_actor_change_thresholds.py
      - name: Run exact weekday COT walk-forward diagnostic
        working-directory: analysis
        run: python diagnose_nq_daily_release_path.py
      - name: Run cumulative NQ weekday history study
        working-directory: analysis
        run: python backtest_nq_cumulative_weekday_history.py
      - name: Run NQ actor change-threshold study
        working-directory: analysis
        run: python backtest_nq_actor_change_thresholds.py
      - name: Validate research contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          walk = json.loads(Path('analysis/daily_release_walkforward_results.json').read_text(encoding='utf-8'))
          assert walk['information_contract']['targets'].startswith('exact calendar Monday-Friday')
          assert walk['information_contract']['lookahead_rule'].startswith('each target may use only earlier COT reports')
          assert walk['markets']['nq']['walk_forward_reports_with_any_realized_weekday'] >= 450
          assert walk['markets']['nq']['current_report']['snapshot_date_tuesday'] == '2026-08-04'

          cumulative = json.loads(Path('analysis/nq_cumulative_weekday_history.json').read_text(encoding='utf-8'))
          assert cumulative['coverage']['scored_cot_states_processed'] == 502
          assert cumulative['coverage']['reports_with_any_realized_cumulative_return'] >= 400
          assert cumulative['coverage']['reports_with_complete_monday_through_friday_path'] >= 350
          assert cumulative['definition']['holiday_rule'].startswith('missing exact weekday')
          for day in ('monday', 'tuesday', 'wednesday', 'thursday', 'friday'):
              assert cumulative['available_history_per_horizon'][day]['observations'] > 0
              assert cumulative['same_sample_complete_weeks']['summary'][day]['observations'] == cumulative['coverage']['reports_with_complete_monday_through_friday_path']

          actors = json.loads(Path('analysis/nq_actor_change_thresholds.json').read_text(encoding='utf-8'))
          assert actors['coverage']['scored_nq_state_universe'] == 502
          assert actors['information_contract']['lookahead_safe'] is True
          assert actors['governance']['threshold_grid'] == [60, 65, 70, 75, 80, 85, 90]
          assert actors['governance']['production_changes'] is False
          assert actors['coverage']['asset_manager_records_on_universe'] >= 490
          assert actors['coverage']['noncommercial_records_on_universe'] >= 490
          for actor in ('asset_manager', 'noncommercial'):
              for direction in ('ADD', 'CUT'):
                  assert set(actors['actors'][actor]['threshold_grid'][direction]) == {'60','65','70','75','80','85','90'}
                  assert actors['actors'][actor]['selected'][direction]['holdout_validation']['classification'] in {
                      'OOS_SUPPORTED', 'FAILED_HOLDOUT', 'NO_STABLE_DISCOVERY_THRESHOLD'
                  }
          print('Exact-weekday, cumulative-history, and actor-threshold contracts PASS')
          PY
