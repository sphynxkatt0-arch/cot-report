name: Exact weekday COT walk-forward diagnostic

on:
  push:
    branches:
      - analysis/nq-daily-release-path-20260810
  pull_request:
    branches:
      - main
    paths:
      - "analysis/diagnose_nq_daily_release_path.py"
      - ".github/workflows/nq-daily-release-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: python -m py_compile analysis/diagnose_nq_daily_release_path.py
      - name: Run exact weekday COT walk-forward diagnostic
        working-directory: analysis
        run: python diagnose_nq_daily_release_path.py
      - name: Upload walk-forward audit
        uses: actions/upload-artifact@v4
        with:
          name: daily-release-walkforward-results
          path: analysis/daily_release_walkforward_results.json
          if-no-files-found: error
