name: Exact weekday COT walk-forward diagnostic

on:
  push:
    branches:
      - analysis/nq-daily-release-path-20260810
  pull_request:
    branches:
      - main
    paths:
      - "analysis/diagnose_nq_daily_release_path.py"
      - ".github/workflows/nq-daily-release-path.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Syntax
        run: python -m py_compile analysis/diagnose_nq_daily_release_path.py
      - name: Run exact weekday COT walk-forward diagnostic
        working-directory: analysis
        run: python diagnose_nq_daily_release_path.py
      - name: Validate walk-forward result contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('analysis/daily_release_walkforward_results.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['information_contract']['targets'].startswith('exact calendar Monday-Friday')
          assert payload['information_contract']['lookahead_rule'].startswith('each target may use only earlier COT reports')
          assert payload['markets']['nq']['walk_forward_reports_with_any_realized_weekday'] >= 450
          assert payload['markets']['nq']['current_report']['snapshot_date_tuesday'] == '2026-08-04'
          print('Exact-weekday walk-forward contract PASS')
          PY
