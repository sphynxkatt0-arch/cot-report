name: Directional COT model tests

on:
  pull_request:
    paths:
      - "analysis/cot_direction_model.py"
      - "analysis/cftc_release_tracker.py"
      - "analysis/macro_direction_adapter.py"
      - "analysis/build_directional_cot_report.py"
      - "analysis/build_directional_cot_system.py"
      - "analysis/inject_directional_dashboard.py"
      - "analysis/refresh_directional_cot_system.py"
      - "analysis/config/cot_direction_model_v1.json"
      - "analysis/tests/**"
      - ".github/workflows/directional-model-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch repository without marketplace actions
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "${SHA}"
          git checkout --detach FETCH_HEAD

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r analysis/requirements.txt

      - name: Compile directional modules
        working-directory: analysis
        run: |
          python -m py_compile \
            cot_direction_model.py \
            cftc_release_tracker.py \
            macro_direction_adapter.py \
            build_directional_cot_report.py \
            build_directional_cot_system.py \
            inject_directional_dashboard.py \
            refresh_directional_cot_system.py

      - name: Run model invariants
        working-directory: analysis
        run: python -m unittest tests.test_cot_direction_model tests.test_release_and_macro -v
