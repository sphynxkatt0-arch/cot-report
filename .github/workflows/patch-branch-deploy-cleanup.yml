name: One-time branch deploy cleanup

on:
  push:
    branches: [fix/branch-deploy-cleanup-20260809]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/branch-deploy-cleanup-20260809
      - name: Remove unnecessary Pages admin mutation
        shell: python
        run: |
          from pathlib import Path
          path = Path('.github/workflows/refresh-and-deploy.yml')
          text = path.read_text()
          old = '''      - name: "[DEPLOYING] Align GitHub Pages source to gh-pages"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/pages-source.json <<'JSON'
          {"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}
          JSON
          gh api -X PUT "/repos/${{ github.repository }}/pages" --input /tmp/pages-source.json
          gh api "/repos/${{ github.repository }}/pages" --jq '{build_type,source,html_url,status}'

'''
          if old not in text:
              raise SystemExit('expected Pages admin mutation block not found')
          text = text.replace(old, '', 1)
          text = text.replace(
              '# Production intentionally publishes from the gh-pages branch. This avoids a\n# hard dependency on GitHub Actions artifact storage, whose account-level quota\n# can temporarily block actions/upload-pages-artifact even after old artifacts\n# have been deleted. The validated research/build pipeline still runs first;\n# only its static output is published.\n',
              '# Production publishes the validated static site directly to gh-pages.\n# This avoids the Actions-artifact quota and matches the currently verified\n# public Pages path; the real github.io endpoint is contract-tested after push.\n'
          )
          path.write_text(text)
          Path('.github/workflows/patch-branch-deploy-cleanup.yml').unlink()
      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/refresh-and-deploy.yml
          git add -u -- .github/workflows/patch-branch-deploy-cleanup.yml
          git commit -m "Remove unnecessary Pages admin mutation"
          git push origin HEAD:fix/branch-deploy-cleanup-20260809
