name: Full COT actor event research CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'analysis/build_cot_actor_event_research*'
      - 'analysis/cftc_release_calendar.py'
      - 'analysis/cot_release_alignment_v2.py'
      - 'analysis/cot_research_core.py'
      - '.github/workflows/cot-actor-event-research-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actor-research-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r analysis/requirements.txt
      - name: Restore full-history research sources
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          cd analysis
          python - <<'PY'
          import build_worldclass_research_artifacts as r
          r.WORLDCLASS.mkdir(parents=True,exist_ok=True)
          r.atomic_write(r.WORLDCLASS/'base.json',r.build_research_base())
          metals=r.ensure_full_metals();r.atomic_write(r.WORLDCLASS/'metals.json',metals)
          PY
      - name: Syntax
        run: python -m py_compile analysis/build_cot_actor_event_research_release_corrected.py
      - name: Run strict release-corrected actor research
        working-directory: analysis
        run: python build_cot_actor_event_research_release_corrected.py
      - name: Validate v2 actor-event contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          full=Path('analysis/worldclass/research/cot-actor-event-research.json')
          summary=Path('analysis/worldclass/research/cot-actor-event-summary.json')
          assert full.is_file() and full.stat().st_size>100_000
          p=json.loads(full.read_text());s=json.loads(summary.read_text())
          assert p['research_generation']=='release-corrected-v2'
          assert p['information_contract_version']=='cftc-public-availability-v2'
          assert p['strict_release_alignment'] is True
          assert p['release_calendar_hash']
          assert s['research_generation']=='release-corrected-v2'
          required={'sp500','nq','vix','rty','dow','gold','silver'}
          assert required==set(p['markets'])==set(s['markets'])
          assert p['same_actor_cross_instrument']
          assert p['cross_actor_same_instrument']
          assert p['cross_report_taxonomy']
          assert p['lead_market_effects']
          print('Strict release-corrected actor-event research PASS')
          PY
