name: Runtime Bundle Integrity

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh and Deploy"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: runtime-integrity-readonly
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
        with:
          ref: main
          path: source
          fetch-depth: 1

      - name: Checkout published branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify immutable release manifest and critical contracts
        shell: bash
        run: |
          set -euo pipefail
          python source/analysis/build_atomic_release.py --verify published
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('published')
          pointer = json.loads((root / 'release-manifest.json').read_text())
          release_id = pointer['current']['release_id']
          release = root / 'releases' / release_id
          wc = release / 'worldclass'

          base = json.loads((wc / 'base.json').read_text())
          model = json.loads((wc / 'model-spec.json').read_text())
          regime = json.loads((wc / 'regime_backtest.json').read_text())
          provenance = json.loads((wc / 'cot-research-provenance.json').read_text())

          assert base.get('COT_DATA')
          assert base.get('PRICE_DATA')
          assert model.get('model_version')
          assert model.get('model_spec_hash')
          assert regime.get('macro_vintage_safe') is False
          assert regime.get('macro_directional_weight') == 0.0
          assert provenance.get('historical_research_frozen') is True
          print('Immutable runtime integrity PASS:', release_id)
          PY