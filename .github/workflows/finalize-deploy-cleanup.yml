name: Finalize deploy cleanup

on:
  workflow_run:
    workflows: ["Refresh and Deploy"]
    types: [completed]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove redundant Pages admin step and temporary workflows
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/refresh-and-deploy.yml')
          text = path.read_text()
          start_marker = '      - name: "[DEPLOYING] Align GitHub Pages source to gh-pages"\n'
          end_marker = '      - name: "[LIVE] Verify published gh-pages contract"\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start + 1)
          if start < 0 or end < 0:
              raise SystemExit('expected Pages admin step boundaries not found')
          text = text[:start] + text[end:]
          text = text.replace(
              '# Production intentionally publishes from the gh-pages branch. This avoids a\n# hard dependency on GitHub Actions artifact storage, whose account-level quota\n# can temporarily block actions/upload-pages-artifact even after old artifacts\n# have been deleted. The validated research/build pipeline still runs first;\n# only its static output is published.\n',
              '# Production publishes the validated static site directly to gh-pages.\n# This avoids the Actions-artifact quota and matches the verified public Pages\n# path; the real github.io endpoint is contract-tested after every deployment.\n'
          )
          path.write_text(text)
          Path('.github/workflows/patch-branch-deploy-cleanup.yml').unlink(missing_ok=True)
          Path('.github/workflows/finalize-deploy-cleanup.yml').unlink(missing_ok=True)
      - name: Commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .github/workflows/refresh-and-deploy.yml
          git add -u -- .github/workflows/patch-branch-deploy-cleanup.yml .github/workflows/finalize-deploy-cleanup.yml
          git commit -m "Finalize quota-independent Pages deployment"
          git push origin HEAD:main
